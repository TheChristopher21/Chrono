<header class="cp-chrome">
  <div class="cp-brand"><span class="cp-logo">c</span><strong>chrono</strong></div>
  <span class="cp-org">Aare Atelier AG</span>
  <div class="cp-chrome-tools">
    <button type="button" class="cw-search" data-act="commands" aria-label="Mitarbeitende und Funktionen suchen"><i data-lucide="search" aria-hidden="true"></i>Suchen …<kbd>Strg K</kbd></button>
    <button type="button" class="cw-workspaces" data-act="quiet-workspaces" aria-label="Arbeitsbereiche öffnen"><i data-lucide="panels-top-left" aria-hidden="true"></i>Arbeitsbereiche <span>2</span></button>
    <button type="button" class="cp-icon" data-act="quiet-more" aria-label="Weitere Funktionen"><i data-lucide="ellipsis" aria-hidden="true"></i></button>
    <button type="button" class="cp-icon" data-act="account" aria-label="Mein Konto"><span class="cp-avatar">CS</span></button>
    <button type="button" data-act="language" hidden>DE</button>
