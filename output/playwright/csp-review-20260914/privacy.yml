            - text: von Apple
          - listitem [ref=e1063]:
            - text: Für
            - link "Edge" [ref=e1064] [cursor=pointer]:
              - /url: https://support.microsoft.com/de-de/windows/l%C3%B6schen-und-verwalten-von-cookies-168dab11-0753-043d-7c16-ede5947fc64d
            - text: von Microsoft
          - listitem [ref=e1065]:
            - text: Für
            - link "Firefox" [ref=e1066] [cursor=pointer]:
