            - text: von Mozilla
        - paragraph [ref=e1067]: Bei Cookies, die für die Erfolgs- und Reichweitenmessung oder für Werbung verwendet werden, ist für zahlreiche Dienste ein allgemeiner Widerspruch («Opt-out») über die Network Advertising Initiative (NAI), YourAdChoices (Digital Advertising Alliance) oder Your Online Choices (European Interactive Digital Advertising Alliance, EDAA) möglich.
        - heading "Zählpixel" [level=4] [ref=e1068]
        - paragraph [ref=e1069]: Wir können Zählpixel auf unserer Website oder in unseren E-Mails verwenden. Zählpixel werden auch als Web-Beacons bezeichnet. Bei Zählpixeln handelt es sich um kleine, üblicherweise nicht sichtbare Bilder, die beim Besuch unserer Website oder beim Öffnen unserer E-Mails automatisch abgerufen werden.
        - paragraph [ref=e1070]:
          - strong [ref=e1071]: Welche Daten verarbeiten wir?
        - paragraph [ref=e1072]: Mit Zählpixeln können die gleichen Angaben wie in Logfiles erfasst werden. Zudem können Bewegungsprofile der gesamten Sitzung erhoben werden. Insbesondere werden Zählpixel durch Dritte, deren Dienste wir nutzen, eingesetzt. Über diese Dienste von Dritten wird in dieser Erklärung nachfolgend im Einzelnen informiert.
        - paragraph [ref=e1073]:
          - strong [ref=e1074]: Zu welchem Zweck verarbeiten wir die Daten?
        - paragraph [ref=e1075]: Zählpixel werden von verschiedenen Trackingdiensten verwendet, um die Nutzung dieser Website zu analysieren und zur statistischen Auswertung sowie für kontinuierliche Verbesserungen. Zudem können Zählpixel für E-Mail-Tracking verwendet werden.
        - paragraph [ref=e1076]:
          - strong [ref=e1077]: An wen geben wir die Daten weiter?
        - paragraph [ref=e1078]:
          - text: Die Weitergabe der Daten durch uns richtet sich nach unseren
          - link "Ausführungen zur Datenweitergabe" [ref=e1079] [cursor=pointer]:
            - /url: "#in-welchen-fallen-geben-wir-ihre-daten-an-dritte-weiter"
          - text: . Beachten Sie zudem die Ausführungen in dieser Datenschutzerklärung zu den einzelnen Trackingdiensten.
        - paragraph [ref=e1080]:
          - strong [ref=e1081]: Wie können Sie die Datenverarbeitung verhindern?
        - paragraph [ref=e1082]: Um die Datenverarbeitung mittels Zählpixeln zu verhindern, können Sie geeignete Browsererweiterungen wie uBlockOrigin installieren und in Ihrem E-Mail-Programm externe Grafiken blockieren.
        - heading "PrivacyBee" [level=4] [ref=e1083]
        - generic [ref=e1084]:
          - paragraph [ref=e1085]: Wir verwenden auf unserer Website den PrivacyBee, eine Dienstleistung des Anbieters PrivacyBee AG, Laupenstrasse 1, 3008 Bern, Schweiz. PrivacyBee wird verwendet, um alle datenschutzrelevanten Dienste zu erkennen und daraus eine individuelle Datenschutzerklärung für die Website zu erzeugen.
          - paragraph [ref=e1086]:
            - strong [ref=e1087]: Welche Daten verarbeiten wir?
            - text: "PrivacyBee ist ein Dienst zur Generierung von Datenschutzerklärungen, die dann per JavaScript in unsere Website eingebunden wird. Für die Bereitstellung dieses Dienstes werden folgende Daten verarbeitet:"
          - list [ref=e1088]:
            - listitem [ref=e1089]: IP-Adresse
            - listitem [ref=e1090]: Browser-Typ und -Version
            - listitem [ref=e1091]: Betriebssystem
            - listitem [ref=e1092]: Datum und Uhrzeit des Zugriffs auf unsere Datenschutzerklärung
          - paragraph [ref=e1093]:
            - strong [ref=e1094]: Zu welchem Zweck verarbeiten wir die Daten?
            - text: Die Erhebung dieser Daten ermöglicht uns, die Datenschutzerklärung korrekt auf Ihrer Endgerätekonfiguration anzuzeigen und sicherzustellen, dass die Inhalte korrekt und auf dem neuesten Stand sind.
          - paragraph [ref=e1095]:
            - strong [ref=e1096]: An wen geben wir die Daten weiter?
            - text: Die Weitergabe der Daten durch uns richtet sich nach unseren Ausführungen zur Datenweitergabe. Die Daten, die durch die Nutzung von PrivacyBee gesammelt werden, bleiben bei PrivacyBee.
          - paragraph [ref=e1097]:
            - strong [ref=e1098]: Wie können Sie die Verarbeitung Ihrer Daten verhindern?
            - text: Um die Verarbeitung Ihrer Daten durch PrivacyBee zu verhindern, können Sie JavaScript in Ihrem Browser deaktivieren. Bitte beachten Sie jedoch, dass bei einer Deaktivierung von JavaScript unter Umständen nicht alle Funktionen unserer Website vollumfänglich nutzbar sind. Eine spezifische Opt-out-Möglichkeit für den Dienst PrivacyBee selbst bieten wir nicht an, da der Dienst wesentlich für die Bereitstellung unserer Datenschutzerklärung ist.
        - heading "Bleibt unsere Datenschutzerklärung immer gleich?" [level=3] [ref=e1099]
        - paragraph [ref=e1100]:
          - text: Wir können diese Datenschutzerklärung jederzeit ändern. Die Änderungen werden auf
          - link "chrono-logisch.ch" [ref=e1101] [cursor=pointer]:
            - /url: https://chrono-logisch.ch
          - text: veröffentlicht. Sie werden nicht gesondert informiert.
