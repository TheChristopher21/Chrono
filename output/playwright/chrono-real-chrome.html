<header class="cp-chrome">
  <button type="button" class="rb-brand" data-view="overview" aria-label="Chrono Startseite">
    <img src="__CHRONO_LOGO__" alt="Chrono" width="40" height="40">
    <span><strong>Arbeitszeit-Rechner</strong><small>Chrono</small></span>
  </button>
  <button type="button" class="rb-platform" data-act="platform">Plattform <i data-lucide="chevron-down" aria-hidden="true"></i></button>
  <div class="cp-chrome-tools">
    <button type="button" class="cw-search" data-act="commands" aria-label="Mitarbeitende und Funktionen suchen"><i data-lucide="search" aria-hidden="true"></i><span>Suchen</span><kbd>Strg K</kbd></button>
    <button type="button" class="cp-icon rb-notifications" data-act="notifications" aria-label="Benachrichtigungen"><i data-lucide="bell" aria-hidden="true"></i><span class="rb-dot"></span></button>
    <button type="button" class="cp-icon" data-act="real-theme" aria-label="Darstellung wechseln"><i data-lucide="sun-moon" aria-hidden="true"></i></button>
    <button type="button" class="rb-language" data-act="account" aria-label="Sprache und Konto"><i data-lucide="globe-2" aria-hidden="true"></i><span>DE</span></button>
    <button type="button" class="rb-account" data-act="account"><span class="cp-avatar">SA</span><span>Super Admin</span><i data-lucide="chevron-down" aria-hidden="true"></i></button>
    <button type="button" data-act="language" hidden>DE</button>
  </div>
</header>
