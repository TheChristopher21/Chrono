:root[data-theme="light"] {

:root[data-theme="dark"] {

}

* {

}

html > body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );

    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))

  padding: var(--visualize-paint-gutter, 0px);
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);

}

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  corner-shape: var(--corner-shape);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive > .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align="right"]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align="center"]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

#widget > :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls > .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls > .form-label > :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn,

.btn:is(.btn-block, .viz-tile) {

a.btn {

.btn:not(:disabled):hover,

  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  color: var(--foreground);

.form-control:disabled,

  width: 100%;
  min-height: 28px;
  margin: 0;

  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);

  background-color: var(--secondary);
  background-image:

.form-select:not(:disabled):hover {

.form-select:focus-visible {

#chrono-browser-design .cr-review {
  padding: 18px 20px 20px;
  background: var(--cp-bg);
  color: var(--cp-ink);
  border-top: 1px solid var(--cp-line);
  font-size: 13px;
  line-height: 1.55;
  min-width: 0;
  overflow-wrap: anywhere;
}
#chrono-browser-design .cr-review p,
#chrono-browser-design .cr-review h3 { margin: 0; }
#chrono-browser-design .cr-review strong { font-size: 14px; font-weight: 500; }
#chrono-browser-design .cr-muted,
#chrono-browser-design .cr-label { color: var(--cp-muted); font-size: 13px; }
#chrono-browser-design .cr-label { display: block; margin-bottom: 5px; }
#chrono-browser-design .cr-date { display: flex; align-items: center; gap: 7px; font-size: 13px; }
#chrono-browser-design .cr-review > .cr-date { margin-bottom: 16px; }
#chrono-browser-design .cr-date svg { color: var(--cp-muted); }
#chrono-browser-design .cr-context { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; }
#chrono-browser-design .cr-context > div { min-width: 0; }
#chrono-browser-design .cr-compare { display: grid; grid-template-columns: minmax(0, 1fr) 18px minmax(0, 1fr); gap: 10px; align-items: center; }
#chrono-browser-design .cr-compare > div { min-width: 0; }
#chrono-browser-design .cr-compare strong { display: block; font-variant-numeric: tabular-nums; }
#chrono-browser-design .cr-compare > div:last-child strong { color: var(--cp-accent); }
#chrono-browser-design .cr-arrow { display: flex; justify-content: center; color: var(--cp-muted); }
#chrono-browser-design .cr-period { display: flex; align-items: flex-start; flex-direction: column; gap: 2px; }
#chrono-browser-design .cr-period .cr-label { margin-bottom: 2px; }
#chrono-browser-design .cr-review .cr-balance { margin-top: 13px; }
#chrono-browser-design .cr-balance strong { font-size: 13px; }
#chrono-browser-design .cr-reason p { white-space: pre-wrap; }
#chrono-browser-design .cr-overlap-block { margin-top: 18px; padding-top: 15px; border-top: 1px solid var(--cp-line); }
#chrono-browser-design .cr-review .cr-overlap-block h3 { font-size: 13px; font-weight: 500; display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 9px; }
#chrono-browser-design .cr-overlaps { padding: 0; margin: 0; list-style: none; display: grid; gap: 9px; }
#chrono-browser-design .cr-overlaps li { display: flex; gap: 8px 18px; justify-content: space-between; flex-wrap: wrap; }
#chrono-browser-design .cr-overlap-person { display: flex; align-items: center; gap: 7px; min-width: 0; }
#chrono-browser-design .cr-overlap-person svg { color: var(--cp-muted); }
#chrono-browser-design .cr-review .cr-data-note { color: var(--cp-muted); font-size: 13px; margin-top: 12px; }
#chrono-browser-design label.cr-note { display: grid; gap: 7px; margin-top: 18px; font-size: 13px; }
#chrono-browser-design .cr-note textarea { width: 100%; min-height: 64px; background: var(--cp-paper); font-size: 13px; line-height: 1.55; padding: 9px 11px; border: 1px solid var(--cp-line); border-radius: 6px; resize: vertical; }
#chrono-browser-design .cr-footer { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-top: 16px; }
#chrono-browser-design .cr-secondary { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
#chrono-browser-design .cr-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#chrono-browser-design button.cr-button { padding: 8px 12px; min-height: 36px; font-size: 13px; background: var(--cp-paper); border: 1px solid var(--cp-line); border-radius: 7px; }
#chrono-browser-design button.cr-button:hover { background: var(--cp-soft); border-color: var(--cp-accent); }
#chrono-browser-design button.cr-primary { color: light-dark(#ffffff, #171323); background: var(--cp-accent); border-color: var(--cp-accent); }
#chrono-browser-design button.cr-primary:hover { background: var(--cp-accent); }
#chrono-browser-design button.cr-link { color: var(--cp-accent); background: transparent; border: 0; padding: 5px 0; border-radius: 0; min-height: 32px; font-size: 13px; }
#chrono-browser-design button.cr-link:hover { color: var(--cp-ink); background: transparent; }
#chrono-browser-design .cr-issue-context { display: flex; gap: 15px 30px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
#chrono-browser-design .cr-issue-context > div { min-width: 0; }
#chrono-browser-design .cr-issue-context .cr-data-note { flex: 1 1 230px; margin: 0; }
#chrono-browser-design label.cr-ack { display: flex; gap: 9px; align-items: flex-start; font-size: 13px; margin-top: 18px; cursor: pointer; }
#chrono-browser-design .cr-ack input { width: 16px; height: 16px; margin: 2px 0 0; flex: none; accent-color: var(--cp-accent); }
@media (max-width: 700px) {
  #chrono-browser-design .cr-review { padding: 16px; }
  #chrono-browser-design .cr-context { grid-template-columns: minmax(0, 1fr); gap: 17px; }
  #chrono-browser-design .cr-compare { max-width: 360px; }
  #chrono-browser-design .cr-footer { align-items: flex-start; }
  #chrono-browser-design .cr-secondary { width: 100%; }
  #chrono-browser-design .cr-actions { margin-left: auto; }
}
@media (pointer: coarse) {
  #chrono-browser-design button.cr-button,
  #chrono-browser-design button.cr-link,
  #chrono-browser-design label.cr-ack { min-height: 44px; }
  #chrono-browser-design .cr-note textarea { font-size: 16px; }
}

/* Local browser preview only. Append after the inherited concept styles. */
#chrono-browser-design .cp-vacation { margin: 0; }
#chrono-browser-design .cp-vac-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}
#chrono-browser-design .cp-vac-selection,
#chrono-browser-design .cp-vac-plan { min-width: 0; }
#chrono-browser-design .cp-vac-monthbar {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) 34px;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
}
#chrono-browser-design .cp-vac-monthbar h3 { text-align: center; font-size: 15px; }
#chrono-browser-design .cp-vac-calendar { overflow: hidden; border-radius: 8px; }
#chrono-browser-design .cp-vac-calendar .cp-cal-heading { padding: 7px 2px; }
#chrono-browser-design .cp-vac-calendar .cp-cal-day {
  min-height: 43px;
  padding: 5px 3px;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
#chrono-browser-design .cp-vac-calendar .cp-cal-day.cp-range {
  background: var(--cp-soft);
  color: var(--cp-accent);
  font-weight: 500;
}
#chrono-browser-design .cp-vac-calendar .cp-event { max-width: 17px; margin: 3px auto 0; }
#chrono-browser-design .cp-vac-legend { display: flex; gap: 13px; flex-wrap: wrap; margin-top: 9px; }
#chrono-browser-design .cp-vac-legend > span { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--cp-muted); }
#chrono-browser-design .cp-vac-legend .cp-vac-key { display: inline-block; width: 11px; height: 8px; border-radius: 2px; }
#chrono-browser-design .cp-vac-key-selection { background: var(--cp-soft); border: 1px solid var(--cp-accent); }
#chrono-browser-design .cp-vac-key-planned { border-bottom: 3px solid var(--cp-warn); }
#chrono-browser-design .cp-vac-key-saved { height: 3px !important; background: var(--cp-accent); }
#chrono-browser-design .cp-vac-dates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 17px; }
#chrono-browser-design .cp-vac-dates input { width: 100%; font-variant-numeric: tabular-nums; }
#chrono-browser-design .cp-vac-options { display: flex; gap: 13px 19px; flex-wrap: wrap; margin-top: 14px; }
#chrono-browser-design .cp-vac-options input { margin: 0; }
#chrono-browser-design .cp-vac-hours { margin-top: 13px; }
#chrono-browser-design .cp-vac-hours > span { display: flex; align-items: center; gap: 8px; color: var(--cp-muted); }
#chrono-browser-design .cp-vac-hours input { width: 105px; color: var(--cp-ink); }
#chrono-browser-design .cp-vac-add { margin-top: 16px; }
#chrono-browser-design .cp-vac-add button { width: 100%; color: var(--cp-accent); }
#chrono-browser-design .cp-vac-plan { border: 1px solid var(--cp-line); background: var(--cp-bg); border-radius: 10px; padding: 17px; display: flex; flex-direction: column; }
#chrono-browser-design .cp-vac-person h3 { font-size: 12px; color: var(--cp-muted); margin-bottom: 8px; }
#chrono-browser-design .cp-vac-person-select select { width: 100%; }
#chrono-browser-design .cp-vac-person-value { display: grid; gap: 3px; }
#chrono-browser-design .cp-vac-person-value strong { font-size: 16px; line-height: 1.35; }
#chrono-browser-design .cp-vac-person-value > span { color: var(--cp-muted); font-size: 12px; }
#chrono-browser-design .cp-vac-company { margin-top: 12px; align-items: flex-start; font-size: 11px; }
#chrono-browser-design .cp-vac-company input { flex: none; margin-top: 3px; }
#chrono-browser-design .cp-vac-periods { margin-top: 19px; border-top: 1px solid var(--cp-line); padding-top: 15px; }
#chrono-browser-design .cp-vac-periods-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
#chrono-browser-design .cp-vac-periods-head h3 { font-size: 13px; }
#chrono-browser-design .cp-vac-period-list { list-style: none; margin: 0; padding: 0; }
#chrono-browser-design .cp-vac-period { display: flex; align-items: flex-start; gap: 7px; padding: 10px 0; border-top: 1px solid var(--cp-line); }
#chrono-browser-design .cp-vac-period:first-child { border-top: 0; padding-top: 0; }
#chrono-browser-design .cp-vac-period > div { flex: 1; min-width: 0; display: grid; gap: 3px; }
#chrono-browser-design .cp-vac-period strong { font-size: 12px; line-height: 1.45; font-variant-numeric: tabular-nums; }
#chrono-browser-design .cp-vac-period > div > span { font-size: 11px; color: var(--cp-muted); }
#chrono-browser-design .cp-vac-period button { flex: none; min-width: 27px; padding: 3px; background: transparent; }
#chrono-browser-design .cp-vac-current { padding: 12px; border: 1px dashed var(--cp-line); border-radius: 7px; display: grid; gap: 4px; margin-top: 4px; }
#chrono-browser-design .cp-vac-current-active { background: var(--cp-paper); border-style: solid; border-left: 3px solid var(--cp-accent); }
#chrono-browser-design .cp-vac-current-label { font-size: 10px; color: var(--cp-muted); }
#chrono-browser-design .cp-vac-current strong { font-size: 12px; line-height: 1.5; }
#chrono-browser-design .cp-vac-current > span:last-child:not(:first-child) { font-size: 11px; color: var(--cp-muted); }
#chrono-browser-design .cp-vac-save { padding-top: 18px; margin-top: auto; }
#chrono-browser-design .cp-vac-save > button { width: 100%; min-height: 39px; }
#chrono-browser-design .cp-vac-secondary { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 8px; }
#chrono-browser-design .cp-vac-secondary button { background: transparent; border-color: transparent; font-size: 11px; padding: 5px; }
#chrono-browser-design .cp-vac-status { grid-column: 1 / -1; border-top: 1px solid var(--cp-line); padding-top: 14px; font-size: 12px; line-height: 1.6; }
#chrono-browser-design .cp-vac-hint { color: var(--cp-muted); }
#chrono-browser-design .cp-vac-validation { color: var(--cp-bad); padding: 10px 12px; background: var(--cp-bg); border-left: 3px solid var(--cp-bad); border-radius: 3px; }
#chrono-browser-design .cp-vac-validation ul { margin: 3px 0 0; padding-left: 17px; }
#chrono-browser-design .cp-vac-saved { margin-top: 9px; color: var(--cp-good); }
#chrono-browser-design .cp-vac-visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
@media (min-width: 900px) {
  #chrono-browser-design .cp-vac-layout { grid-template-columns: minmax(0, 1.35fr) minmax(230px, .9fr); gap: 20px 26px; }
  #chrono-browser-design .cp-vac-plan { align-self: stretch; }
}
@media (max-width: 480px) {
  #chrono-browser-design .cp-vac-layout { gap: 16px; }
  #chrono-browser-design .cp-vac-plan { padding: 14px; }
  #chrono-browser-design .cp-vac-dates { gap: 8px; }
  #chrono-browser-design .cp-vac-dates input { padding: 8px 5px; font-size: 12px; }
  #chrono-browser-design .cp-vac-options { gap: 12px; }
  #chrono-browser-design .cp-vac-options label { font-size: 11px; }
  #chrono-browser-design .cp-vac-calendar .cp-cal-day { min-height: 39px; }
}

#chrono-browser-design .re-profile,
#chrono-browser-design .re-day-detail { color: var(--cp-ink); font-size: 13px; line-height: 1.55; min-width: 0; }
#chrono-browser-design .re-profile h3,
#chrono-browser-design .re-profile p,
#chrono-browser-design .re-profile dl,
#chrono-browser-design .re-profile dd { margin: 0; }
#chrono-browser-design .re-profile h3,
#chrono-browser-design .re-profile strong,
#chrono-browser-design .re-day-detail strong { font-size: 14px; font-weight: 500; }
#chrono-browser-design .re-muted { font-size: 13px; color: var(--cp-muted); }
#chrono-browser-design .re-identity { display: flex; gap: 18px; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 3px 0 22px; }
#chrono-browser-design .re-identity-copy { display: flex; gap: 13px; align-items: center; min-width: 0; }
#chrono-browser-design .re-identity-copy > div { min-width: 0; overflow-wrap: anywhere; }
#chrono-browser-design .re-identity-copy p { color: var(--cp-muted); font-size: 13px; margin-top: 2px; }
#chrono-browser-design .re-avatar { width: 44px; height: 44px; border-radius: 12px; background: var(--cp-soft); color: var(--cp-accent); display: grid; place-items: center; font-size: 14px; font-weight: 500; flex: none; }
#chrono-browser-design .re-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
#chrono-browser-design button.re-button { min-height: 38px; padding: 8px 12px; background: var(--cp-paper); border: 1px solid var(--cp-line); border-radius: 7px; font-size: 13px; }
#chrono-browser-design button.re-button:hover { background: var(--cp-soft); border-color: var(--cp-accent); }
#chrono-browser-design button.re-primary,
#chrono-browser-design button.re-primary:hover { background: var(--cp-accent); border-color: var(--cp-accent); color: light-dark(#fff, #171323); }
#chrono-browser-design button.re-link { font-size: 13px; color: var(--cp-accent); background: transparent; border: 0; padding: 5px 0; min-height: 32px; border-radius: 0; }
#chrono-browser-design button.re-link:hover { color: var(--cp-ink); background: transparent; }
#chrono-browser-design button.re-icon-button { width: 34px; min-height: 34px; padding: 7px; background: transparent; border: 1px solid var(--cp-line); border-radius: 7px; flex: none; }
#chrono-browser-design button.re-icon-button:hover { background: var(--cp-soft); }
#chrono-browser-design .re-profile-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(225px, 1fr); gap: 20px; align-items: start; }
#chrono-browser-design .re-main-column,
#chrono-browser-design .re-aside-column { display: grid; gap: 20px; min-width: 0; }
#chrono-browser-design .re-section { border: 1px solid var(--cp-line); border-radius: 10px; background: var(--cp-paper); padding: 17px; min-width: 0; overflow-wrap: anywhere; }
#chrono-browser-design .re-section-heading { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 17px; }
#chrono-browser-design .re-section-heading > div { min-width: 0; }
#chrono-browser-design .re-section-heading p { color: var(--cp-muted); font-size: 13px; margin-top: 3px; }
#chrono-browser-design .re-section-heading > svg { color: var(--cp-muted); }
#chrono-browser-design .re-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
#chrono-browser-design .re-metrics > div + div { border-left: 1px solid var(--cp-line); padding-left: 12px; }
#chrono-browser-design .re-metrics dt { font-size: 13px; color: var(--cp-muted); margin-bottom: 5px; }
#chrono-browser-design .re-metrics dd { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
#chrono-browser-design .re-metrics dd span { font-size: 13px; font-weight: 400; color: var(--cp-muted); }
#chrono-browser-design .re-negative { color: var(--cp-bad); }
#chrono-browser-design .re-positive { color: var(--cp-good); }
#chrono-browser-design .re-issue { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--cp-line); }
#chrono-browser-design .re-issue > div { flex: 1; min-width: 0; }
#chrono-browser-design .re-issue strong { font-size: 13px; }
#chrono-browser-design .re-issue p { font-size: 13px; color: var(--cp-muted); }
#chrono-browser-design .re-issue-icon { color: var(--cp-warn); display: flex; flex: none; }
#chrono-browser-design .re-clear { display: flex; gap: 8px; align-items: center; color: var(--cp-muted); margin-top: 17px; padding-top: 13px; border-top: 1px solid var(--cp-line); }
#chrono-browser-design .re-clear > svg { color: var(--cp-good); }
#chrono-browser-design .re-count { color: var(--cp-muted); font-weight: 400; font-size: 13px; padding-left: 5px; }
#chrono-browser-design .re-request { border-top: 1px solid var(--cp-line); }
#chrono-browser-design .re-request > summary { list-style: none; display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 13px 0; }
#chrono-browser-design .re-request > summary::-webkit-details-marker { display: none; }
#chrono-browser-design .re-request > summary > span:nth-child(2) { min-width: 0; flex: 1; }
#chrono-browser-design .re-request > summary strong { font-size: 13px; display: block; }
#chrono-browser-design .re-request > summary small { color: var(--cp-muted); font-size: 13px; display: block; }
#chrono-browser-design .re-request-type-icon { color: var(--cp-muted); display: flex; flex: none; }
#chrono-browser-design .re-request-open { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--cp-accent); }
#chrono-browser-design .re-request[open] > summary .re-request-open svg { transform: rotate(180deg); }
#chrono-browser-design .re-request .cr-review { margin: 0 -10px 10px; padding: 15px 12px; border-radius: 7px; border-top: 0; }
#chrono-browser-design .re-request .cr-context { grid-template-columns: minmax(0, 1fr); gap: 15px; }
#chrono-browser-design .re-request .cr-secondary { width: 100%; }
#chrono-browser-design .re-request .cr-actions { margin-left: auto; }
#chrono-browser-design .re-calendar-nav { display: flex; gap: 6px; align-items: center; flex: none; }
#chrono-browser-design .re-weekdays,
#chrono-browser-design .re-calendar-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
#chrono-browser-design .re-weekdays { padding-bottom: 7px; }
#chrono-browser-design .re-weekdays > span { text-align: center; font-size: 13px; color: var(--cp-muted); }
#chrono-browser-design button.re-calendar-day { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; min-height: 43px; padding: 5px 2px; border: 0; border-radius: 6px; background: transparent; font-size: 13px; font-variant-numeric: tabular-nums; }
#chrono-browser-design button.re-calendar-day:hover { background: var(--cp-soft); }
#chrono-browser-design button.re-today { background: var(--cp-soft); color: var(--cp-accent); font-weight: 500; }
#chrono-browser-design button.re-outside { color: var(--cp-muted); opacity: .6; }
#chrono-browser-design .re-day-markers { display: flex; align-items: center; justify-content: center; gap: 3px; min-height: 5px; }
#chrono-browser-design .re-day-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--cp-accent); flex: none; }
#chrono-browser-design .re-day-dot.re-day-sick { background: var(--cp-bad); }
#chrono-browser-design .re-day-markers b { font-size: 13px; line-height: 5px; font-weight: 400; }
#chrono-browser-design .re-calendar-legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--cp-line); font-size: 13px; color: var(--cp-muted); }
#chrono-browser-design .re-calendar-legend > span { display: flex; align-items: center; gap: 7px; }
#chrono-browser-design .re-calendar-mobile { display: none; }
#chrono-browser-design .re-leave-section { background: var(--cp-bg); }
#chrono-browser-design .re-leave-value { display: flex; align-items: baseline; gap: 7px; margin-bottom: 5px; }
#chrono-browser-design .re-leave-value strong { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
#chrono-browser-design .re-leave-value > span { font-size: 13px; }
#chrono-browser-design .re-profile .re-leave-fact { display: flex; gap: 10px; justify-content: space-between; color: var(--cp-muted); margin-top: 11px; }
#chrono-browser-design .re-leave-fact strong { font-size: 13px; color: var(--cp-ink); }
#chrono-browser-design .re-absence-row { display: flex; align-items: flex-start; gap: 9px; padding: 13px 0; border-top: 1px solid var(--cp-line); }
#chrono-browser-design .re-event-icon { display: flex; color: var(--cp-accent); padding-top: 2px; flex: none; }
#chrono-browser-design .re-event-icon.re-sick { color: var(--cp-bad); }
#chrono-browser-design .re-row-copy { flex: 1; min-width: 0; overflow-wrap: anywhere; }
#chrono-browser-design .re-row-copy strong { display: block; font-size: 13px; }
#chrono-browser-design .re-row-copy > span,
#chrono-browser-design .re-row-copy p { display: block; font-size: 13px; color: var(--cp-muted); margin: 3px 0 0; }
#chrono-browser-design .re-row-copy p { white-space: pre-wrap; }
#chrono-browser-design .re-absence-actions { padding-top: 10px; border-top: 1px solid var(--cp-line); }
#chrono-browser-design .re-empty { color: var(--cp-muted); font-size: 13px; padding: 8px 0 17px; }
#chrono-browser-design .re-profile .re-incomplete { margin: 12px 0; }
#chrono-browser-design .re-profile-footer,
#chrono-browser-design .re-bottom-actions { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--cp-line); padding-top: 16px; margin-top: 22px; }
#chrono-browser-design .re-profile-footer > span { color: var(--cp-muted); font-size: 13px; }
#chrono-browser-design .re-day-entries { margin-top: 18px; }
@media (max-width: 1000px) {
  #chrono-browser-design .re-profile-grid { grid-template-columns: minmax(0, 1fr); }
  #chrono-browser-design .re-aside-column { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); }
}
@media (max-width: 620px) {
  #chrono-browser-design .re-aside-column { grid-template-columns: minmax(0, 1fr); }
  #chrono-browser-design .re-identity { align-items: flex-start; }
  #chrono-browser-design .re-identity > .re-actions { width: 100%; }
  #chrono-browser-design .re-section { padding: 14px; }
  #chrono-browser-design .re-section-heading { flex-wrap: wrap; }
  #chrono-browser-design .re-issue { align-items: flex-start; flex-wrap: wrap; }
  #chrono-browser-design .re-issue > .re-link { margin-left: 26px; }
  #chrono-browser-design .re-request-open { gap: 4px; }
  #chrono-browser-design .re-metrics { gap: 8px; }
  #chrono-browser-design .re-metrics > div + div { padding-left: 8px; }
}
@media (max-width: 460px) {
  #chrono-browser-design .re-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #chrono-browser-design .re-metrics > div:last-child { grid-column: 1 / -1; border-left: 0; padding-left: 0; padding-top: 10px; border-top: 1px solid var(--cp-line); }
  #chrono-browser-design .re-calendar { display: none; }
  #chrono-browser-design .re-calendar-mobile { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
  #chrono-browser-design .re-calendar-mobile > label { flex: 1 1 140px; min-width: 0; font-size: 13px; }
  #chrono-browser-design .re-calendar-mobile input { width: 100%; min-width: 0; }
  #chrono-browser-design .re-mobile-month-list { flex: 1 1 100%; min-width: 0; margin-top: 5px; }
  #chrono-browser-design .re-calendar-nav { margin-left: auto; }
  #chrono-browser-design .re-profile-footer { align-items: flex-start; flex-direction: column; }
}
@media (pointer: coarse) {
  #chrono-browser-design button.re-button,
  #chrono-browser-design button.re-icon-button,
  #chrono-browser-design button.re-link,
  #chrono-browser-design button.re-calendar-day,
  #chrono-browser-design .re-request > summary { min-height: 44px; }
  #chrono-browser-design button.re-icon-button { min-width: 44px; }
  #chrono-browser-design .re-calendar-mobile input { font-size: 16px; }
}

/* Insert in the mock engine scope. Uses E, btn, icon, fmt, requests, people,
   events and readOnly; all writes stay with the existing delegated handlers. */
function deskReviewDate(value) {
  if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return '';
  const parsed = new Date(value + 'T12:00:00Z');
  return Number.isFinite(parsed.getTime()) && parsed.toISOString().slice(0, 10) === value ? value : '';
}

function deskReviewPeriod(start, end) {
  const first = deskReviewDate(start), last = deskReviewDate(end);
  if (!first || !last || first > last) return '';
  return first === last ? fmt(first) : fmt(first) + ' – ' + fmt(last);
}

function deskReviewPerson(id) {
  return people.find(person => String(person.id) === String(id));
}

function deskReviewOverlaps(request, person) {
  const start = deskReviewDate(request.date), end = deskReviewDate(request.end);
  if (!start || !end || start > end) return '';
  if (!person || !person.team) {
    return '<p class="cr-muted">Für den Teamvergleich fehlt die Teamzuordnung.</p>';
  }
  const seen = new Set();
  const sameTeam = events.filter(event => {
    const owner = deskReviewPerson(event.p);
    if (!owner || owner.team !== person.team || String(event.requestId) === String(request.id)) return false;
    if (event.id != null && seen.has(String(event.id))) return false;
    if (event.id != null) seen.add(String(event.id));
    return true;
  });
  const invalid = sameTeam.filter(event => !deskReviewPeriod(event.start, event.end || event.start)).length;
  const overlaps = sameTeam.filter(event => {
    const first = deskReviewDate(event.start), last = deskReviewDate(event.end || event.start);
    return first && last && first <= last && first <= end && last >= start;
  }).sort((a, b) => a.start.localeCompare(b.start));
  const items = overlaps.map(event => {
    const owner = deskReviewPerson(event.p);
    const own = String(owner.id) === String(person.id);
    const first = event.start > start ? event.start : start;
    const last = (event.end || event.start) < end ? (event.end || event.start) : end;
    return `<li><div class="cr-overlap-person">${icon(own ? 'user' : 'users')}<span>${E(own ? 'Eigener Abwesenheitseintrag' : owner.name)}</span></div><span class="cr-muted">${E(event.kind || 'Abwesenheit')}${event.half ? ' · halbtags' : ''} · ${E(deskReviewPeriod(first, last))}</span></li>`;
  }).join('');
  return `<section class="cr-overlap-block" aria-label="Zeitgleiche Abwesenheiten im Team"><h3>Überschneidungen im Team <span class="cr-muted">${E(person.team)}</span></h3>${items ? `<ul class="cr-overlaps">${items}</ul>` : '<p class="cr-muted">Keine Überschneidung mit den datierten Abwesenheiten im Teamkalender.</p>'}${invalid ? `<p class="cr-data-note">${invalid === 1 ? 'Ein weiterer Team-Eintrag hat' : E(invalid) + ' weitere Team-Einträge haben'} kein vollständiges Datum und ${invalid === 1 ? 'kann' : 'können'} hier nicht verglichen werden.</p>` : ''}</section>`;
}

function deskReviewRequest(request) {
  const person = deskReviewPerson(request.p);
  const vacation = request.type === 'Urlaub';
  const date = vacation ? deskReviewPeriod(request.date, request.end) : deskReviewPeriod(request.date, request.date);
  const closed = request.status !== 'Offen';
  const locked = readOnly() || closed;
  const attrs = `data-id="${E(request.id)}"`;
  const leaveDate = person && deskReviewDate(person.leaveBalanceAsOf);
  const leave = person && typeof person.leaveRemaining === 'number' && Number.isFinite(person.leaveRemaining) && person.leaveRemaining >= 0 && leaveDate
    ? `<p class="cr-balance">Verfügbarer Urlaub: <strong>${E(person.leaveRemaining.toLocaleString('de-CH'))} Tage</strong><span class="cr-muted"> · Stand ${E(fmt(leaveDate))}</span></p>` : '';
  const comparison = vacation
    ? `<div class="cr-period"><span class="cr-label">Beantragter Zeitraum</span><strong>${E(date || 'Zeitraum nicht vollständig hinterlegt')}</strong>${request.half === true ? '<span class="cr-muted">Halber Tag</span>' : ''}${request.overtime === true ? '<span class="cr-muted">Überstundenabbau</span>' : ''}</div>${leave}`
    : `<div class="cr-compare"><div><span class="cr-label">Bisher erfasst</span><strong>${E(request.old == null || request.old === '' ? 'Nicht hinterlegt' : request.old)}</strong></div><span class="cr-arrow">${icon('arrow-right')}</span><div><span class="cr-label">Beantragt</span><strong>${E(request.next == null || request.next === '' ? 'Nicht hinterlegt' : request.next)}</strong></div></div>`;
  const correctionMissing = !vacation && (request.next == null || request.next === '');
  return `<section class="cr-review" aria-label="Antrag prüfen">
    ${vacation ? '' : `<p class="cr-date">${icon('calendar-days')}<span>${E(date || 'Datum nicht hinterlegt')}</span></p>`}
    <div class="cr-context"><div>${comparison}</div><div class="cr-reason"><span class="cr-label">Grund des Antrags</span><p>${E(request.reason || 'Kein Grund hinterlegt.')}</p></div></div>
    ${vacation ? deskReviewOverlaps(request, person) : ''}
    ${!date || correctionMissing ? '<p class="cr-data-note">Vor dem Genehmigen müssen die fehlenden Antragsdaten ergänzt werden.</p>' : ''}
    <label class="cr-note"><span>Kommentar <span class="cr-muted">· optional</span></span><textarea data-note="${E(request.id)}" rows="2" placeholder="Rückmeldung zur Entscheidung" ${locked ? 'disabled' : ''}>${E(request.note || '')}</textarea></label>
    <div class="cr-footer"><div class="cr-secondary">${btn('requesttime', 'In Zeitprüfung öffnen ' + icon('arrow-up-right'), 'cr-link', attrs)}${closed ? `<span class="cr-muted">${E(request.status)}</span>` : readOnly() ? '<span class="cr-muted">Nur Ansicht</span>' : ''}</div><div class="cr-actions">${btn('deny', 'Ablehnen', 'cr-button', `${attrs} ${locked ? 'disabled' : ''}`)}${btn('approve', icon('check') + ' Genehmigen', 'cr-button cr-primary', `${attrs} ${locked || !date || correctionMissing || !person ? 'disabled' : ''}`)}</div></div>
  </section>`;
}

function deskReviewIssue(person) {
  const exact = deskReviewDate(person.issueDate);
  const start = deskReviewDate(person.issueStart), end = deskReviewDate(person.issueEnd);
  const period = exact ? fmt(exact) : deskReviewPeriod(start, end);
  const editDate = exact || (start && start === end ? start : '');
  const weekly = /wochenabweichung/i.test(person.issue || '');
  const hasAck = weekly && typeof person.ack === 'boolean';
  const action = editDate
    ? btn('editday', 'Tag bearbeiten ' + icon('arrow-up-right'), 'cr-button', `data-p="${E(person.id)}" data-date="${E(editDate)}" ${readOnly() ? 'disabled' : ''}`)
    : btn('person', 'In Zeitprüfung öffnen ' + icon('arrow-up-right'), 'cr-button', `data-p="${E(person.id)}"`);
  return `<section class="cr-review cr-issue" aria-label="Zeithinweis prüfen">
    <div class="cr-issue-context"><div><span class="cr-label">Zu prüfen</span><strong>${E(person.issue || 'Kein offener Zeithinweis')}</strong></div>${period ? `<p class="cr-date">${icon('calendar-days')}<span>${E(period)}</span></p>` : '<p class="cr-data-note">Für diesen Hinweis ist kein Datum hinterlegt. Die zugehörigen Einträge lassen sich in der Zeitprüfung zuordnen.</p>'}</div>
    ${hasAck ? `<label class="cr-ack"><input type="checkbox" data-ack="${E(person.id)}" ${person.ack ? 'checked' : ''} ${readOnly() ? 'disabled' : ''}><span>Wochenabweichung geprüft und in Ordnung</span></label>` : ''}
    <div class="cr-footer"><span class="cr-muted">${hasAck && person.ack ? 'Als geprüft markiert' : readOnly() ? 'Nur Ansicht' : ''}</span><div class="cr-actions">${action}${editDate ? btn('person', 'Zeitprüfung öffnen', 'cr-link', `data-p="${E(person.id)}"`) : ''}</div></div>
  </section>`;
}

function deskReview(key) {
  const match = /^([rp])(\d+)$/.exec(String(key));
  if (!match) return '';
  const item = match[1] === 'r'
    ? requests.find(request => String(request.id) === match[2])
    : deskReviewPerson(match[2]);
  if (!item) return '<section class="cr-review"><p class="cr-muted">Dieser Vorgang ist nicht mehr verfügbar.</p></section>';
  return match[1] === 'r' ? deskReviewRequest(item) : deskReviewIssue(item);
}

function timeView(){const start=new Date(2026,8,14+state.week*7),end=new Date(2026,8,20+state.week*7);let list=people.filter(p=>!p.hidden&&p.name.toLowerCase().includes(state.search.toLowerCase())&&(!state.issue||state.issue==='Alle Probleme'&&p.issue&&!p.ack||state.issue===p.issue&&!p.ack));if(state.sort==='balance')list.sort((a,b)=>a.balance-b.balance);else list.sort((a,b)=>a.name.localeCompare(b.name));return `<div class="cp-toolbar">${btn('prevweek','←','','aria-label="Vorige Woche"')}<strong>${fmt(ymd(start))} – ${fmt(ymd(end))}</strong>${btn('nextweek','→','','aria-label="Nächste Woche"')}${btn('today','Heute')}${btn('jumpdate',icon('calendar-days'),'cp-icon','aria-label="Zu Datum springen"')}<span style="flex:1"></span><select data-bind="timeMode" aria-label="Zeitansicht"><option value="week" ${state.timeMode==='week'?'selected':''}>Woche</option><option value="month" ${state.timeMode==='month'?'selected':''}>Monat / Zeitraum</option></select>${btn('print',icon('printer')+'Zeiten drucken')}</div>${state.timeMode==='month'?`<div class="cp-time-range"><label>Zeitraum-Modus<select data-bind="cycle"><option value="calendar" ${state.cycle==='calendar'?'selected':''}>Kalendermonat</option><option value="customCycle" ${state.cycle==='customCycle'?'selected':''}>Abrechnungszyklus</option><option value="manual" ${state.cycle==='manual'?'selected':''}>Manuell wählen</option></select></label>${state.cycle==='customCycle'?`<label>Starttag im Monat<input type="number" min="1" max="31" data-bind="cycleDay" value="${state.cycleDay}"></label>`:''}<label>Von<input type="date" data-bind="rangeStart" value="${state.rangeStart}" ${state.cycle==='manual'?'':'disabled'}></label><label>Bis<input type="date" data-bind="rangeEnd" value="${state.rangeEnd}" ${state.cycle==='manual'?'':'disabled'}></label>${btn('resetRange','Zurücksetzen')}</div>`:''}<div class="cp-toolbar"><input type="search" data-bind="search" value="${E(state.search)}" placeholder="Mitarbeitende suchen" aria-label="Mitarbeitende suchen"><select data-bind="issue" aria-label="Problemtyp"><option value="">Alle Mitarbeitenden</option>${opts(['Alle Probleme','Fehlende Stempel','Ende fehlt','Automatisch beendet','Feiertag offen','Wochenabweichung'],state.issue)}</select>${btn('hidden',icon('eye-off')+'Ausgeblendete ('+people.filter(p=>p.hidden).length+')')}</div><div class="cp-table-wrap"><table><thead><tr><th>${btn('sortName','Mitarbeitende ↕')}</th><th>Ist</th><th>Soll</th><th>Periodensaldo</th><th>${btn('sortBalance','Gesamtsaldo ↕')}</th><th>Prüfung</th><th>Aktion</th></tr></thead><tbody>${list.map(p=>`<tr><td>${btn('person',p.name,'',`data-p="${p.id}"`)}<small style="display:block">${p.team}</small></td><td class="cp-num">${p.actual}</td><td class="cp-num">${p.target}</td><td class="cp-num ${p.balance<0?'cp-negative':''}">${money(p.balance)}</td><td class="cp-num">${money(p.balance)}</td><td>${p.ack?'Geprüft':p.issue||'✓ In Ordnung'}</td><td>${btn('days',icon('chevron-down'),'cp-icon',`data-p="${p.id}" aria-label="Tagesdetails ${p.name}"`)}${btn('print',icon('printer'),'cp-icon',`data-p="${p.id}" aria-label="Zeitbericht ${p.name}"`)}${btn('hide',icon('eye-off'),'cp-icon',`data-p="${p.id}" aria-label="${p.name} ausblenden"`)}</td></tr>`).join('')||'<tr><td colspan="7">Keine passenden Mitarbeitenden.</td></tr>'}</tbody></table></div><p class="cp-muted">Laufende Perioden werden nur bis heute berechnet. Historische Perioden zeigen den vollständigen Zeitraum.</p>${state.person!==null?daysView(people[state.person]):''}`}
function daysView(p){return panel('days',p.name+' · Tagesprüfung','14.–20. September',`<label class="cp-check" style="margin-bottom:14px"><input type="checkbox" data-ack="${p.id}" ${p.ack?'checked':''}>Ungewöhnliche Plus-/Minusstunden geprüft und in Ordnung</label><div class="cp-daygrid">${['Mo, 14.','Di, 15.','Mi, 16.','Do, 17.'].map((d,i)=>`<div class="cp-day"><strong>${d} September</strong><small>${i===2?'Feiertag · Sollentscheidung':i===1?'Keine Stempel erfasst':p.entries.map(t=>t.time).join(' · ')}</small><small>${i===1?'Ist 0:00 · Soll 8:00':'Ist 8:15 · Pause 0:30'}</small>${btn('editday',i===1?'+ Eintrag':'Zeiten bearbeiten','',`data-p="${p.id}" data-date="2026-09-${14+i}"`)}${i===2?`<label style="margin-top:7px">Feiertag<select data-holiday="${p.id}"><option>Ausstehend</option><option>Soll reduzieren</option><option>Soll nicht reduzieren</option></select></label>`:''}${i===1?btn('swap','Arbeitstag tauschen','',`data-p="${p.id}"`):''}</div>`).join('')}</div>`,btn('closeDays','Details schliessen','cp-text'))}
function cal(month,mini=false,planner=null){const offset=(new Date(month.getFullYear(),month.getMonth(),1).getDay()+6)%7,count=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),cells=Math.ceil((offset+count)/7)*7;return `<div class="cp-calendar ${mini?'cp-mini':''}">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(n=>`<div class="cp-cal-heading">${n}</div>`).join('')}${Array.from({length:cells},(_,i)=>{const d=new Date(month.getFullYear(),month.getMonth(),i-offset+1),iso=ymd(d),found=events.filter(e=>iso>=e.start&&iso<=e.end&&(mini?planner?.company||e.p===Number(planner?.person):state.calendarUser==='all'||e.p===Number(state.calendarUser)));return `<button type="button" class="cp-cal-day ${d.getMonth()!==month.getMonth()?'cp-outside':''} ${iso==='2026-09-14'?'cp-today':''} ${planner?.start&&iso>=planner.start&&iso<=(planner.end||planner.start)?'cp-range':''} ${planner?.queue.some(e=>iso>=e.start&&iso<=e.end)?'cp-queued':''}" data-act="${mini?'pickdate':'daydetail'}" data-date="${iso}" aria-label="${fmt(iso)}${found.length?' · '+found.length+' Abwesenheiten':''}">${d.getDate()}${found.slice(0,2).map(e=>`<span class="cp-event ${e.kind==='Krank'?'cp-sick':''}">${e.kind==='Krank'?'K · ':''}${people[e.p].name.split(' ')[0]}</span>`).join('')}${found.length>2?'<span class="cp-event">+'+(found.length-2)+'</span>':''}</button>`}).join('')}</div>`}
function calendarView(){return `<div class="cp-toolbar">${btn('calprev','←','','aria-label="Voriger Monat"')}<h2>${state.month.toLocaleDateString('de-CH',{month:'long',year:'numeric'})}</h2>${btn('calnext','→','','aria-label="Nächster Monat"')}<select data-bind="calendarUser" aria-label="Mitarbeitende im Kalender">${personOpts(state.calendarUser,true)}</select><span style="flex:1"></span>${btn('sick',icon('heart-pulse')+'Krank melden')}${btn('vacation','+ Urlaub eintragen','cp-primary')}</div><div class="cp-panel" style="overflow:clip">${cal(state.month)}</div><div class="cp-footerline"><span>Violett · Urlaub / Überstundenfrei &nbsp; Rot · Krank</span><span>Tag auswählen, um Details zu sehen</span></div>`}
function modulesView(){const list=modules.filter(m=>m.join(' ').toLowerCase().includes(state.moduleSearch.toLowerCase())&&(state.role!=='Nur Ansicht'||!['Admin-Passwort','Firmenverwaltung','PMS Master-Einstellungen'].includes(m[0])));return `<div class="cp-toolbar"><input type="search" data-bind="moduleSearch" value="${E(state.moduleSearch)}" placeholder="Modul suchen" aria-label="Module suchen"><span class="cp-muted">${list.length} freigegebene Bereiche · ${state.role}</span></div><div class="cp-module-grid">${list.map(([name,sub,i])=>`<button class="cp-module" data-act="module" data-module="${E(name)}">${icon(i)}<h3>${name}</h3><small>${sub} ↗</small></button>`).join('')}</div>`}
function renderContent(){q('.cp-content').innerHTML=state.view==='overview'?(r.dataset.concept==='fokus'?requestsView(true):overview()):state.view==='time'?timeView():state.view==='requests'?requestsView():state.view==='calendar'?calendarView():modulesView();icons()}
function openVacation(ev=null,p=null,date=null){if(!canWrite())return;state.planner={contextPerson:p!==null,edit:ev?.id||null,person:ev?.p??p??(state.calendarUser==='all'?0:Number(state.calendarUser)),company:ev?.company||false,start:ev?.start||date||'',end:ev?.end||date||'',half:ev?.half||false,overtime:ev?.overtime||false,hours:ev?.hours||'',queue:[],month:new Date((ev?.start||date||ymd(state.month))+'T12:00:00'),saved:''};renderVacation()}
function readVacation(){const f=q('[data-form=vacation]');if(!f)return;const p=state.planner;p.person=f.elements.person.value;p.company=f.elements.company.checked;p.start=f.elements.start.value;p.end=f.elements.end.value;p.half=f.elements.half.checked;p.overtime=f.elements.overtime.checked;p.hours=f.elements.hours.value}
// Replace only renderVacation() in the local browser mockup.
// The existing planner state, form reader, calendar and action handlers remain in use.
function renderVacation() {
  const p = state.planner;
  if (!p) return;
  if (p.contextPerson) p.company = false;

  const person = people.find(item => String(item.id) === String(p.person));
  const locked = p.contextPerson || p.queue.length > 0 || !!p.edit;
  const showHours = p.overtime && !p.company;
  const hasDraft = !!(p.start || p.end);
  const complete = !!(p.start && p.end && p.end >= p.start);
  const overlaps = complete && p.queue.some(item => p.start <= item.end && p.end >= item.start);
  const errors = [];
  if (p.start && p.end && p.end < p.start) errors.push('Das Enddatum muss am oder nach dem Startdatum liegen.');
  if (p.half && complete && p.start !== p.end) errors.push('Halbtags ist nur für einen einzelnen Tag möglich.');
  if (showHours && complete && !(Number(p.hours) > 0)) errors.push('Bitte die abzuziehenden Überstunden angeben.');
  if (overlaps) errors.push('Der ausgewählte Zeitraum überschneidet sich mit einem geplanten Urlaub.');

  const periodText = item => item.start === item.end
    ? fmt(item.start)
    : `${fmt(item.start)} – ${fmt(item.end)}`;
  const kindText = item => `${item.half ? 'Halbtags' : 'Ganztags'} · ${item.overtime && !p.company ? 'Überstundenfrei' : 'Urlaub'}${item.overtime && !p.company && item.hours ? ` · ${E(item.hours)} h` : ''}`;
  const total = p.queue.length + (complete && !errors.length ? 1 : 0);
  const selectionText = complete
    ? periodText(p)
    : p.start ? `Ab ${fmt(p.start)} · Ende wählen` : 'Noch kein Zeitraum ausgewählt';
  const nextStep = p.start && !p.end
    ? 'Enddatum wählen. Du kannst dafür den Monat wechseln.'
    : !hasDraft && p.queue.length
      ? 'Weiteren Zeitraum wählen oder die geplanten Urlaube speichern.'
      : !hasDraft
        ? 'Start und Ende im Kalender wählen. Für einen Tag zweimal dasselbe Datum anklicken.'
        : p.edit
          ? 'Zeitraum prüfen und Änderungen speichern.'
          : 'Auswahl prüfen und speichern. Weitere Zeiträume lassen sich separat hinzufügen.';

  open(p.edit ? 'Urlaub bearbeiten' : 'Urlaub planen', `
    <form data-form="vacation" class="cp-vacation" aria-describedby="cp-vac-help">
      <div class="cp-vac-layout">
        <section class="cp-vac-selection" aria-label="Zeitraum auswählen">
          <div class="cp-vac-monthbar">
            ${btn('plannerprev', '←', 'cp-icon', 'aria-label="Voriger Planungsmonat"')}
            <h3>${p.month.toLocaleDateString('de-CH', { month: 'long', year: 'numeric' })}</h3>
            ${btn('plannernext', '→', 'cp-icon', 'aria-label="Nächster Planungsmonat"')}
          </div>
          <div class="cp-vac-calendar">${cal(p.month, true, p)}</div>
          <div class="cp-vac-legend" aria-label="Kalenderlegende">
            <span><i class="cp-vac-key cp-vac-key-selection" aria-hidden="true"></i>Auswahl</span>
            <span><i class="cp-vac-key cp-vac-key-planned" aria-hidden="true"></i>Geplant</span>
            <span><i class="cp-vac-key cp-vac-key-saved" aria-hidden="true"></i>Gespeichert</span>
          </div>
          <div class="cp-vac-dates">
            <label>Von<input name="start" type="date" value="${E(p.start)}" aria-describedby="cp-vac-help"></label>
            <label>Bis<input name="end" type="date" value="${E(p.end)}" min="${E(p.start)}" aria-invalid="${!!(p.start && p.end && p.end < p.start)}" aria-describedby="cp-vac-help"></label>
          </div>
          <div class="cp-vac-options">
            <label class="cp-check"><input name="half" type="checkbox" ${p.half ? 'checked' : ''}>Halbtags</label>
            <label class="cp-check" ${p.company ? 'hidden' : ''}><input name="overtime" type="checkbox" ${p.overtime ? 'checked' : ''} ${p.company ? 'disabled' : ''}>Überstunden nutzen</label>
          </div>
          <label class="cp-vac-hours" ${showHours ? '' : 'hidden'}>Überstundenabzug
            <span><input name="hours" type="number" step="0.25" min="0.25" value="${E(p.hours)}" placeholder="z. B. 4" ${showHours ? '' : 'disabled'} aria-describedby="cp-vac-help"><span>Stunden</span></span>
          </label>
          ${p.edit ? '' : `<div class="cp-vac-add">${btn('addperiod', 'Zeitraum hinzufügen', '', `aria-describedby="cp-vac-help" ${!complete || errors.length ? 'disabled' : ''}`)}</div>`}
        </section>

        <aside class="cp-vac-plan" aria-label="Urlaubsplanung">
          <div class="cp-vac-person">
            <h3>${p.company ? 'Betriebsurlaub' : 'Für wen?'}</h3>
            ${locked || p.company ? `
              <select name="person" hidden disabled aria-label="Mitarbeitende">${personOpts(p.person)}</select>
              <div class="cp-vac-person-value"><strong>${p.company ? 'Gesamtes Team' : E(person?.name || '')}</strong>${!p.company && person?.team ? `<span>${E(person.team)}</span>` : ''}</div>
            ` : `<label class="cp-vac-person-select"><span class="cp-vac-visually-hidden">Mitarbeitende</span><select name="person">${personOpts(p.person)}</select></label>`}
            ${p.contextPerson
              ? '<input name="company" type="checkbox" hidden disabled aria-label="Betriebsurlaub">'
              : `<label class="cp-check cp-vac-company"><input name="company" type="checkbox" ${p.company ? 'checked' : ''} ${locked ? 'disabled' : ''}>Betriebsurlaub für das gesamte Team</label>`}
          </div>

          <div class="cp-vac-periods">
            <div class="cp-vac-periods-head"><h3>${p.edit ? 'Zeitraum' : 'Geplante Zeiträume'}</h3>${total ? `<span class="cp-tag">${total}</span>` : ''}</div>
            ${p.queue.length && !p.edit ? `<ol class="cp-vac-period-list">${p.queue.map((item, i) => `
              <li class="cp-vac-period">
                <div><strong>${periodText(item)}</strong><span>${kindText(item)}</span></div>
                ${btn('removeperiod', '×', 'cp-icon', `data-i="${i}" aria-label="Zeitraum ${E(periodText(item))} entfernen"`)}
              </li>`).join('')}</ol>` : ''}
            <div class="cp-vac-current ${hasDraft ? 'cp-vac-current-active' : ''}">
              <span class="cp-vac-current-label">${hasDraft ? p.edit ? 'Bearbeitung' : 'Aktuelle Auswahl' : p.queue.length ? 'Weiterer Zeitraum' : 'Auswahl'}</span>
              <strong>${selectionText}</strong>
              ${complete ? `<span>${kindText(p)}</span>` : ''}
            </div>
          </div>

          <div class="cp-vac-save">
            <button type="button" class="cp-primary" data-act="localSubmit" ${errors.length || (!p.queue.length && !complete) || (hasDraft && !complete) || readOnly() ? 'disabled' : ''}>${p.edit ? 'Änderungen speichern' : total > 1 ? `${total} Zeiträume speichern` : 'Urlaub speichern'}</button>
            <div class="cp-vac-secondary">${p.edit ? btn('eventdelete', 'Urlaub löschen', 'cp-danger', `data-id="${p.edit}"`) : ''}${btn('close', 'Schliessen')}</div>
          </div>
        </aside>

        <div class="cp-vac-status" id="cp-vac-help" aria-live="polite" aria-atomic="true">
          ${errors.length ? `<div class="cp-vac-validation" role="alert"><strong>Bitte prüfen</strong><ul>${errors.map(error => `<li>${error}</li>`).join('')}</ul></div>` : `<p class="cp-vac-hint">${nextStep}</p>`}
          ${p.saved ? `<p class="cp-vac-saved" role="status">${E(p.saved)}</p>` : ''}
        </div>
      </div>
    </form>`);
}

function draftPeriod(){readVacation();const p=state.planner;if(!p.start||!p.end||p.end<p.start){toast('Bitte einen gültigen Start- und Endtermin wählen.');return null}if(p.half&&p.start!==p.end){toast('Halbtags ist nur für einen einzelnen Tag möglich.');return null}if(p.overtime&&!p.company&&!(Number(p.hours)>0)){toast('Bitte die abzuziehenden Überstunden eingeben.');return null}if(p.queue.some(a=>p.start<=a.end&&p.end>=a.start)){toast('Dieser Zeitraum überschneidet sich mit einem vorgemerkten Urlaub.');return null}return{start:p.start,end:p.end,half:p.half,overtime:p.overtime&&!p.company,hours:Number(p.hours)||0}}
function saveVacation(){const p=state.planner;readVacation();let periods=[...p.queue];if(p.start||p.end||!periods.length){const a=draftPeriod();if(!a)return;periods.push(a)}if(p.edit){const e=events.find(e=>e.id===p.edit);Object.assign(e,periods[0],{p:Number(p.person),company:p.company});p.saved='Urlaub aktualisiert. Die Änderung ist direkt im Kalender sichtbar.'}else{for(const period of periods){for(const person of p.company?people:[people[Number(p.person)]])events.push({id:++uid,p:person.id,kind:'Urlaub',...period,company:p.company})}p.saved=`${periods.length} ${periods.length===1?'Zeitraum':'Zeiträume'} gespeichert. Du kannst direkt weitere Urlaube eintragen.`;p.start='';p.end='';p.queue=[];p.half=false;p.hours=''}renderVacation();toast('Urlaub gespeichert · Kalender ist aktuell.')}
function sickForm(ev=null,date=null,p=0){if(!canWrite())return;open(ev?'Krankmeldung bearbeiten':'Krankmeldung eintragen',`<form data-form="sick" data-id="${ev?.id||''}"><div class="cp-fields"><label class="cp-wide">Mitarbeitende<select name="person">${personOpts(ev?.p??p)}</select></label><label>Startdatum<input type="date" name="start" value="${ev?.start||date||'2026-09-14'}" required></label><label>Enddatum<input type="date" name="end" value="${ev?.end||date||'2026-09-14'}" required></label><label class="cp-check"><input name="half" type="checkbox" ${ev?.half?'checked':''}>Halbtags</label><label class="cp-wide">Kommentar<textarea name="comment" placeholder="Optionale Notiz">${E(ev?.comment||'')}</textarea></label></div><div class="cp-sheet-foot">${ev?btn('eventdelete','Krankmeldung löschen','cp-danger',`data-id="${ev.id}"`):''}${btn('close','Abbrechen')}<button type="button" class="cp-primary" data-act="localSubmit">Krankmeldung speichern</button></div></form>`)}
function dayDetail(date){const es=events.filter(e=>date>=e.start&&date<=e.end&&(state.calendarUser==='all'||e.p===Number(state.calendarUser)));open('Abwesenheiten · '+fmt(date),`${es.map(e=>`<div class="cp-row">${avatar(e.p)}<div class="cp-grow"><strong>${people[e.p].name}</strong><small>${e.kind} · ${fmt(e.start)} – ${fmt(e.end)}${e.half?' · halbtags':''}</small><small>${E(e.comment||'')}</small></div>${btn('eventedit','Bearbeiten','',`data-id="${e.id}"`)}${btn('eventdelete','Löschen','cp-danger',`data-id="${e.id}"`)}</div>`).join('')||'<p class="cp-muted">Keine Abwesenheiten an diesem Tag.</p>'}<div class="cp-sheet-foot">${btn('sickdate','Krank melden','',`data-date="${date}"`)}${btn('vacationdate','+ Urlaub eintragen','cp-primary',`data-date="${date}"`)}</div>`)}
function editDay(p,date,empty=false){if(!canWrite())return;state.editPerson=p;state.editDate=date;state.editEntries=empty?[]:people[p].entries.map(x=>({...x}));renderEdit()}
function captureEntries(){qa('[data-entry]').forEach(row=>{const i=Number(row.dataset.entry);state.editEntries[i]={kind:row.querySelector('select').value,time:row.querySelector('input[type=time]').value,note:row.querySelector('input[type=text]').value}})}
function renderEdit(){open('Zeiterfassung · '+people[state.editPerson].name,`<p class="cp-subtitle" style="margin-bottom:16px">${fmt(state.editDate)} · Stempel chronologisch bearbeiten</p><form data-form="entries">${state.editEntries.map((e,i)=>`<div class="cp-fields" data-entry="${i}" style="margin-bottom:12px;grid-template-columns:85px 95px minmax(0,1fr) 32px"><select aria-label="Stempeltyp">${opts(['START','ENDE'],e.kind)}</select><input type="time" value="${e.time}" aria-label="Uhrzeit" required><input type="text" value="${E(e.note)}" placeholder="Notiz" aria-label="Stempelnotiz">${btn('entryremove','×','cp-icon',`data-i="${i}" aria-label="Stempel entfernen"`)}</div>`).join('')}<div class="cp-toolbar">${btn('entryadd','+ Stempel hinzufügen')}${btn('pause','Standardpause einfügen')}</div><div class="cp-sheet-foot">${btn('close','Abbrechen')}<button type="button" class="cp-primary" data-act="localSubmit">Zeiten speichern</button></div></form>`)}

function reportView(){const x=state.report,p=people[x.p];open('Zeitbericht · Druckvorschau',`<h2>${p.name}</h2><p class="cp-subtitle">${fmt(x.start)} – ${fmt(x.end)}</p><div class="cp-stats" style="margin:22px 0"><div class="cp-stat"><span>Arbeitszeit</span><strong>${p.actual}</strong></div><div class="cp-stat"><span>Pausen</span><strong>2:30</strong></div><div class="cp-stat"><span>Zeitsaldo</span><strong>${money(p.balance)}</strong></div></div><div class="cp-table-wrap"><table><thead><tr><th>Datum</th><th>Arbeitsblöcke</th><th>Arbeitszeit</th><th>Pause</th></tr></thead><tbody><tr><td>${fmt(x.start)}</td><td>08:00–12:00 · 12:30–16:45</td><td>8:15</td><td>0:30</td></tr></tbody></table></div><p class="cp-muted" style="margin-top:12px">Entwurf · Beispieldaten. Der Download enthält diesen Beispiel-Zeitbericht.</p><div class="cp-sheet-foot">${btn('print','Zeitraum ändern')}${btn('downloadReport',icon('download')+'PDF herunterladen','cp-primary')}</div>`)}
function downloadReport(){const x=state.report,p=people[x.p],clean=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e]/g,'-').replace(/[()\\]/g,' '),lines=['CHRONO - ZEITBERICHT',p.name,`${x.start} bis ${x.end}`,`Arbeitszeit ${p.actual}    Pausen 2:30    Saldo ${money(p.balance)}`,'Beispieldaten - Designentwurf','Arbeitsbloecke 08:00-12:00 / 12:30-16:45'];let content='BT /F1 12 Tf 50 780 Td '+lines.map((s,i)=>(i?'0 -24 Td ':'')+'('+clean(s)+') Tj').join('\n')+' ET';const objs=['<< /Type /Catalog /Pages 2 0 R >>','<< /Type /Pages /Kids [3 0 R] /Count 1 >>','<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R >> >> /Contents 5 0 R >>','<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>',`<< /Length ${content.length} >>\nstream\n${content}\nendstream`];let pdf='%PDF-1.4\n',offset=[0];objs.forEach((o,i)=>{offset.push(pdf.length);pdf+=`${i+1} 0 obj\n${o}\nendobj\n`});const pos=pdf.length;pdf+='xref\n0 6\n0000000000 65535 f \n'+offset.slice(1).map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${pos}\n%%EOF`;const url=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'})),a=document.createElement('a');a.href=url;a.download='Chrono-Beispiel-Zeitbericht.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Beispiel-PDF erstellt.')}

function renderCommands(search){const arr=[['Urlaubscenter öffnen','cmdvac'],['Korrekturcenter öffnen','cmdcorr'],['Zur aktuellen Woche springen','cmdtoday'],['Offene Korrekturen ≤15 Minuten freigeben','cmdlow'],...people.map(p=>['Mitarbeiter '+p.name+' fokussieren','cmdperson'+p.id])];q('[data-command-list]').innerHTML=arr.filter(x=>x[0].toLowerCase().includes(search.toLowerCase())).map(([name,act])=>btn(act,name+'<span>↗</span>','cp-command-row')).join('')||'<p class="cp-muted">Kein passender Befehl.</p>'}

function decision(id,status){const wasDesk=state.view==='overview';if(!canWrite())return;const a=requests.find(a=>a.id===id);if(!a)return;a.status=status;if(status==='Genehmigt'&&a.type==='Urlaub'&&!events.some(e=>e.requestId===id))events.push({id:++uid,p:a.p,kind:'Urlaub',start:a.date,end:a.end,requestId:id});if(wasDesk){state.activeWorkspace=0;state.deskSelected=null;state.deskFeedback=`${a.type} von ${people[a.p].name} ${status.toLowerCase()}.`;q('.cp-sheet').hidden=true;q('.cp-content').hidden=false}render();if(!wasDesk)toast(`${a.type} von ${people[a.p].name} ${status.toLowerCase()}.`)}

r.addEventListener('input',e=>{if(e.target.dataset.note)requests.find(a=>a.id===Number(e.target.dataset.note)).note=e.target.value;if(e.target.hasAttribute('data-command-search'))renderCommands(e.target.value);const key=e.target.dataset.bind;if(['search','reqSearch','moduleSearch'].includes(key)){const pos=e.target.selectionStart;state[key]=e.target.value;renderContent();const input=q(`[data-bind="${key}"]`);input.focus();input.setSelectionRange(pos,pos)}});

r.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.dataset.form==='vacation')return saveVacation();if(f.dataset.form==='sick'){if(!canWrite())return;const a={p:Number(f.elements.person.value),kind:'Krank',start:f.elements.start.value,end:f.elements.end.value,half:f.elements.half.checked,comment:f.elements.comment.value};if(a.end<a.start||a.half&&a.start!==a.end)return toast('Bitte gültigen Zeitraum wählen; halbtags nur an einem Tag.');const id=Number(f.dataset.id);if(id)Object.assign(events.find(x=>x.id===id),a);else events.push({id:++uid,...a});close();toast('Krankmeldung gespeichert · Kalender aktualisiert.')}if(f.dataset.form==='entries'){captureEntries();let last='',bad=false;state.editEntries.forEach((a,i)=>{if(!a.time||a.time<=last||a.kind!==(i%2===0?'START':'ENDE'))bad=true;last=a.time});if(bad)return toast('Bitte chronologische START-/ENDE-Stempel eingeben.');people[state.editPerson].entries=state.editEntries.map(x=>({...x}));people[state.editPerson].issue='';close();toast('Zeitstempel gespeichert und neu berechnet.')}if(f.dataset.form==='report'){const a={p:Number(f.elements.person.value),start:f.elements.start.value,end:f.elements.end.value};if(a.end<a.start)return toast('Enddatum darf nicht vor Startdatum liegen.');state.report=a;reportView()}if(f.dataset.form==='swap'){people[Number(f.dataset.p)].swap=f.elements.replacement.value;close();toast('Arbeitstag mit '+fmt(f.elements.replacement.value)+' getauscht. '+f.elements.note.value)}});
r.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!r.contains(b))return;if(b.dataset.view)return nav(b.dataset.view);const a=b.dataset.act,id=Number(b.dataset.id),p=Number(b.dataset.p||0),i=Number(b.dataset.i);if(!a)return;if(a==='close')return close();if(a==='dashboard')return nav('overview');if(a==='alltime'||a==='priorityIssues'){state.issue=a==='priorityIssues'?'Alle Probleme':'';return nav('time')}if(a==='allrequests'||a==='priorityRequests')return nav('requests');if(a==='allcalendar'||a==='priorityAbsence')return nav('calendar');if(a==='allmodules'||a==='tabadd')return nav('modules');if(a==='theme'){state.theme=state.theme==='dark'?'light':'dark';r.style.colorScheme=state.theme;return toast(state.theme==='dark'?'Dunkle Darstellung':'Helle Darstellung')}if(a==='language'){state.lang=state.lang==='de'?'en':'de';return render()}if(a==='account')return account();if(a==='accountlogout')return open('Abmelden','<p>Du bist in einer lokalen Designvorschau. Das echte Konto bleibt angemeldet.</p><div class="cp-sheet-foot">'+btn('close','Zurück','cp-primary')+'</div>');if(a==='platform')return open('Plattform wechseln',`<div class="cp-shortcuts">${['Chrono Zeiterfassung','Chrono 2.0','Hotelverwaltung (PMS)','Supply Chain'].map(n=>btn('module',n,'',`data-module="${n}"`)).join('')}</div>`);if(a==='notifications')return open('Benachrichtigungen',requests.filter(a=>a.status==='Offen').map(a=>`<div class="cp-row"><div class="cp-grow"><strong>${people[a.p].name}</strong><small>${a.type} eingereicht · heute</small></div>${btn('request','Prüfen','cp-text',`data-id="${a.id}"`)}</div>`).join(''));if(a==='stamp'){state.stamped=!state.stamped;render();return toast(state.stamped?'Eingestempelt um 09:42 · Beispielbuchung.':'Ausgestempelt · Beispielbuchung gespeichert.')}if(a==='workspace'){state.activeWorkspace=i;workspace();if(i===0)return nav('overview');return modulePreview(state.workspace[i].title)}if(a==='pin'){state.workspace[i].pin=!state.workspace[i].pin;return workspace()}if(a==='tabclose'){state.workspace.splice(i,1);state.activeWorkspace=0;return render()}if(a==='module')return modulePreview(b.dataset.module);if(a==='commands')return commands();if(a.startsWith('cmdperson')){state.person=Number(a.slice(9));state.search=people[state.person].name;return nav('time')}if(a==='cmdvac'||a==='cmdcorr'){state.reqType=a==='cmdvac'?'Urlaub':'Korrektur';return nav('requests')}if(a==='cmdtoday'){state.week=0;return nav('time')}if(a==='cmdlow'){if(!canWrite())return;const list=requests.filter(a=>a.type==='Korrektur'&&a.status==='Offen'&&a.old!=='—'&&Math.abs(Number(a.next.replace(':','.'))-Number(a.old.replace(':','.')))<=.15);list.forEach(x=>x.status='Genehmigt');close();render();return toast(`${list.length} Korrektur(en) bis 15 Minuten genehmigt.`)}if(a==='request'){state.selected=id;state.reqStatus='Alle';nav('requests');return}if(a==='selectRequest'){state.selected=id;return renderContent()}if(a==='approve'||a==='deny')return decision(id,a==='approve'?'Genehmigt':'Abgelehnt');if(a==='requestdelete'){if(!canWrite())return;return open('Urlaubsantrag löschen',`<p>Diesen Urlaubsantrag aus der Beispielansicht entfernen?</p><div class="cp-sheet-foot">${btn('close','Abbrechen')}${btn('confirmRequestDelete','Urlaubsantrag löschen','cp-danger',`data-id="${id}"`)}</div>`)}if(a==='confirmRequestDelete'){requests.splice(requests.findIndex(x=>x.id===id),1);events=events.filter(x=>x.requestId!==id);close();render();return toast('Urlaubsantrag gelöscht.')}if(a==='requesttime'){const x=requests.find(x=>x.id===id);state.person=x.p;state.search=people[x.p].name;nav('time');return}if(a==='requestfilters')return open('Anträge sortieren & gruppieren',`<div class="cp-fields"><label>Sortierung<select data-bind="reqSort">${opts(['Datum','Mitarbeiter'],state.reqSort)}</select></label><label>Gruppieren nach<select data-bind="reqGroup">${opts(['Keine','Typ','Team'],state.reqGroup)}</select></label></div><div class="cp-sheet-foot">${btn('close','Anwenden','cp-primary')}</div>`);if(a==='person'){state.person=p;state.search=people[p].name;nav('time');return}if(a==='days'){state.person=state.person===p?null:p;return renderContent()}if(a==='closeDays'){state.person=null;return renderContent()}if(a==='hide'){people[p].hidden=true;renderContent();return toast(people[p].name+' ausgeblendet.')}if(a==='hidden')return open('Ausgeblendete Mitarbeitende',people.filter(p=>p.hidden).map(p=>`<div class="cp-row"><strong class="cp-grow">${p.name}</strong>${btn('unhide','Wieder anzeigen','',`data-p="${p.id}"`)}</div>`).join('')+`<div class="cp-sheet-foot">${btn('unhideall','Alle wieder anzeigen')}</div>`);if(a==='unhide'||a==='unhideall'){people.forEach(x=>{if(a==='unhideall'||x.id===p)x.hidden=false});close();return renderContent()}if(a==='sortName'||a==='sortBalance'){state.sort=a==='sortName'?'name':'balance';return renderContent()}if(a==='prevweek'||a==='nextweek'||a==='today'){state.week=a==='today'?0:state.week+(a==='nextweek'?1:-1);return renderContent()}if(a==='jumpdate')return open('Zu einem Datum springen',`<label>Datum<input type="date" data-jumpdate value="2026-09-14"></label><div class="cp-sheet-foot">${btn('applyjump','Woche öffnen','cp-primary')}</div>`);if(a==='applyjump'){state.week=Math.floor((new Date(q('[data-jumpdate]').value+'T12:00:00')-new Date(2026,8,14,12))/604800000);close();return renderContent()}if(a==='resetRange'){state.cycle='calendar';state.rangeStart='2026-09-01';state.rangeEnd='2026-09-30';return renderContent()}if(a==='editday')return editDay(p,b.dataset.date,b.dataset.date==='2026-09-15');if(a==='entryadd'){captureEntries();state.editEntries.push({kind:state.editEntries.length%2?'ENDE':'START',time:state.editEntries.length?'17:00':'08:00',note:''});return renderEdit()}if(a==='entryremove'){captureEntries();state.editEntries.splice(i,1);return renderEdit()}if(a==='pause'){captureEntries();state.editEntries=[{kind:'START',time:'08:00',note:''},{kind:'ENDE',time:'12:00',note:'Standardpause'},{kind:'START',time:'12:30',note:'Pause beendet'},{kind:'ENDE',time:'17:00',note:''}];renderEdit();return toast('Standardpause von 30 Minuten eingefügt.')}if(a==='swap')return open('Arbeitstag tauschen',`<form data-form="swap" data-p="${p}"><p class="cp-subtitle" style="margin-bottom:16px">${people[p].name} · Dienstag, 15. September</p><div class="cp-fields"><label>Ersatztag<select name="replacement"><option value="2026-09-17">Donnerstag, 17. September</option><option value="2026-09-18">Freitag, 18. September</option></select></label><label>Notiz<input name="note" placeholder="z. B. Donnerstag statt Dienstag"></label></div><div class="cp-sheet-foot">${people[p].swap?btn('removeswap','Tausch entfernen','cp-danger',`data-p="${p}"`):''}${btn('close','Abbrechen')}<button type="button" class="cp-primary" data-act="localSubmit">Tausch speichern</button></div></form>`);if(a==='removeswap'){delete people[p].swap;close();return toast('Arbeitstagtausch entfernt.')}if(a==='print')return printForm(p);if(a==='downloadReport')return downloadReport();if(a==='calprev'||a==='calnext'){state.month=new Date(state.month.getFullYear(),state.month.getMonth()+(a==='calnext'?1:-1),1);return renderContent()}if(a==='vacation')return openVacation();if(a==='sick')return sickForm();if(a==='vacationdate')return openVacation(null,null,b.dataset.date);if(a==='sickdate')return sickForm(null,b.dataset.date);if(a==='daydetail')return dayDetail(b.dataset.date);if(a==='eventedit'){const ev=events.find(x=>x.id===id);return ev.kind==='Krank'?sickForm(ev):openVacation(ev)}if(a==='eventdelete')return removeEvent(id);if(a==='confirmEventDelete'){events=events.filter(x=>x.id!==id);close();return toast('Abwesenheit gelöscht · Saldo neu berechnet.')}if(a==='plannerprev'||a==='plannernext'){readVacation();const p=state.planner;p.month=new Date(p.month.getFullYear(),p.month.getMonth()+(a==='plannernext'?1:-1),1);return renderVacation()}if(a==='pickdate'){readVacation();const p=state.planner;if(!p.start||p.end){p.star let lastG=0;r.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();commands();return}if(e.key==='Escape'){close();return}if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key.toLowerCase()==='h'||e.key.toLowerCase()==='l'){state.week+=e.key.toLowerCase()==='l'?1:-1;nav('time')}if(e.key.toLowerCase()==='g'){if(Date.now()-lastG<700){state.week=0;nav('time')}lastG=Date.now()}});
