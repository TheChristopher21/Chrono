.form-check {

  gap: 6px;
}

.form-check-input {

  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:

    border-color 150ms,

}

  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);

.form-check:not(.form-switch)

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {

.form-check:not(.form-switch)

  height: 100%;

  height: 14px;

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;

.form-switch .form-check-input:disabled,

.form-range::-moz-range-track {

.form-range::-moz-range-thumb {

  height: 20px;

  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],

) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);

.btn:focus-visible,

  }

  }

    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;

  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;

  }

  .form-range {
    height: 44px;

  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }

.text-warning,

  &lt;script&gt;
  (()=&gt;{
    const root=document.getElementById(&#x27;chrono-team-concept&#x27;);
    const main=root.querySelector(&#x27;.ct-main&#x27;), host=root.querySelector(&#x27;.ct-dialog-host&#x27;);
    const isPlan=root.dataset.layout===&#x27;plan&#x27;;
    const people=[{name:&#x27;Mirjam Burkart&#x27;,initials:&#x27;MB&#x27;,role:&#x27;Administration · 80 %&#x27;,balance:&#x27;−12h 15m&#x27;,issue:&#x27;Unvollständig&#x27;,pattern:&#x27;ggfff&#x27;},{name:&#x27;Gabriela Tschopp&#x27;,initials:&#x27;GT&#x27;,role:&#x27;Administration · 100 %&#x27;,balance:&#x27;+30h 49m&#x27;,issue:&#x27;Vollständig&#x27;,pattern:&#x27;ggfff&#x27;},{name:&#x27;Milka Otten&#x27;,initials:&#x27;MO&#x27;,role:&#x27;Service · 100 %&#x27;,balance:&#x27;−1744h 00m&#x27;,issue:&#x27;Fehlende Zeit&#x27;,pattern:&#x27;rgfff&#x27;},{name:&#x27;Anna Fischer&#x27;,initials:&#x27;AF&#x27;,role:&#x27;Service · 80 %&#x27;,balance:&#x27;−444h 00m&#x27;,issue:&#x27;Fehlende Zeit&#x27;,pattern:&#x27;rrfff&#x27;},{name:&#x27;Demo Manager&#x27;,initials:&#x27;DM&#x27;,role:&#x27;Management · 100 %&#x27;,balance:&#x27;−399h 00m&#x27;,issue:&#x27;Auto-geschlossen&#x27;,pattern:&#x27;rgfff&#x27;},{name:&#x27;Ben Keller&#x27;,initials:&#x27;BK&#x27;,role:&#x27;Logistik · 100 %&#x27;,balance:&#x27;−315h 00m&#x27;,issue:&#x27;Fehlende Zeit&#x27;,pattern:&#x27;rrfff&#x27;}];
    const modules=[&#x27;Benutzerverwaltung&#x27;,&#x27;Payroll&#x27;,&#x27;Dienstplan&#x27;,&#x27;Schichtregeln&#x27;,&#x27;Analytics&#x27;,&#x27;Kunden&#x27;,&#x27;Projekte&#x27;,&#x27;Aufgaben&#x27;,&#x27;Projektbericht&#x27;,&#x27;Finanzbuchhaltung&#x27;,&#x27;Chrono 2.0&#x27;,&#x27;CRM&#x27;,&#x27;Supply Chain&#x27;,&#x27;PMS&#x27;,&#x27;Zahlungsverkehr&#x27;,&#x27;Firmenwissen&#x27;,&#x27;Firmeneinstellungen&#x27;,&#x27;Import&#x27;,&#x27;Firmenverwaltung&#x27;,&#x27;Admin-Passwort&#x27;];
    const state={view:&#x27;overview&#x27;,team:&#x27;Alle Teams&#x27;,employee:&#x27;Mirjam Burkart&#x27;,query:&#x27;&#x27;,filter:&#x27;Alle&#x27;,month:8,year:2026,weekOffset:0,requests:10,requestType:&#x27;Korrekturen&#x27;,history:false,decisions:[],queue:[],absences:[],hidden:false,theme:&#x27;Automatisch&#x27;,compact:false,radius:isPlan?10:13,widgets:[{id:&#x27;priorities&#x27;,label:&#x27;Prioritäten&#x27;,visible:true,size:&#x27;Normal&#x27;},{id:&#x27;team&#x27;,label:isPlan?&#x27;Wochenplanung&#x27;:&#x27;Mitarbeitende&#x27;,visible:true,size:&#x27;Breit&#x27;},{id:&#x27;absences&#x27;,label:&#x27;Abwesenheiten&#x27;,visible:true,size:&#x27;Normal&#x27;},{id:&#x27;requests&#x27;,label:&#x27;Offene Anträge&#x27;,visible:true,size:&#x27;Normal&#x27;},{id:&#x27;modules&#x27;,label:&#x27;Module&#x27;,visible:true,size:&#x27;Normal&#x27;}]};
    const esc=s=&gt;String(s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g,c=&gt;({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));
    const fmt=d=&gt;new Date(d+&#x27;T12:00:00&#x27;).toLocaleDateString(&#x27;de-CH&#x27;,{day:&#x27;2-digit&#x27;,month:&#x27;2-digit&#x27;,year:&#x27;numeric&#x27;});
    const person=()=&gt;people.find(p=&gt;p.name===state.employee)||people[0];
    function toast(t){const el=root.querySelector(&#x27;.ct-toast&#x27;);el.textContent=t;clearTimeout(toast.timer);toast.timer=setTimeout(()=&gt;el.textContent=&#x27;&#x27;,4500)}
    function closeDialog(){host.innerHTML=&#x27;&#x27;;root.classList.remove(&#x27;ct-dialog-open&#x27;)}
    function dialog(title,content,footer=&#x27;&#x27;){root.classList.add(&#x27;ct-dialog-open&#x27;);host.innerHTML=`&lt;section class=&quot;ct-dialog&quot; role=&quot;dialog&quot; aria-modal=&quot;true&quot; aria-label=&quot;${esc(title)}&quot;&gt;&lt;div class=&quot;ct-dialog-head&quot;&gt;&lt;h2&gt;${title}&lt;/h2&gt;&lt;button data-action=&quot;close-dialog&quot; aria-label=&quot;Dialog schliessen&quot;&gt;×&lt;/button&gt;&lt;/div&gt;${content}${footer?`&lt;div class=&quot;ct-dialog-actions&quot;&gt;${footer}&lt;/div&gt;`:&#x27;&#x27;}&lt;/section&gt;`;const f=host.querySelector(&#x27;input:not([type=checkbox]),select&#x27;);if(f)f.focus({preventScroll:true})}
    function visible(id){return state.widgets.find(w=&gt;w.id===id)?.visible!==false}
    function heading(title,sub,actions=&#x27;&#x27;){return `&lt;div class=&quot;ct-heading&quot;&gt;&lt;div&gt;&lt;div class=&quot;ct-eyebrow&quot;&gt;${isPlan?&#x27;Planungsraum&#x27;:&#x27;Menschen im Mittelpunkt&#x27;} · 14. September 2026&lt;/div&gt;&lt;h1&gt;${title}&lt;/h1&gt;&lt;p&gt;${sub}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ct-heading-actions&quot;&gt;${actions}&lt;/div&gt;&lt;/div&gt;`}
    function toolbar(){return `&lt;div class=&quot;ct-toolbar&quot;&gt;&lt;input aria-label=&quot;Mitarbeitende suchen&quot; placeholder=&quot;Mitarbeitende suchen …&quot; data-input=&quot;employee-search&quot; value=&quot;${esc(state.query)}&quot;&gt;&lt;select aria-label=&quot;Team auswählen&quot; data-input=&quot;team-filter&quot;&gt;&lt;option&gt;Alle Teams&lt;/option&gt;&lt;option&gt;Administration&lt;/option&gt;&lt;option&gt;Service&lt;/option&gt;&lt;option&gt;Logistik&lt;/option&gt;&lt;/select&gt;&lt;button data-action=&quot;customize&quot;&gt;Anpassen&lt;/button&gt;&lt;/div&gt;`}
    function summaries(){return `&lt;div class=&quot;ct-summary&quot; data-widget=&quot;priorities&quot;&gt;&lt;button data-view=&quot;requests&quot;&gt;&lt;span class=&quot;ct-summary-label&quot;&gt;ZUR ENTSCHEIDUNG&lt;/span&gt;&lt;span class=&quot;ct-summary-value&quot;&gt;${state.requests}&lt;/span&gt;&lt;span class=&quot;ct-summary-detail&quot;&gt;Anträge ansehen ↗&lt;/span&gt;&lt;/button&gt;&lt;button data-view=&quot;time&quot;&gt;&lt;span class=&quot;ct-summary-label&quot;&gt;ZEITEN PRÜFEN&lt;/span&gt;&lt;span class=&quot;ct-summary-value&quot;&gt;7&lt;/span&gt;&lt;span class=&quot;ct-summary-detail&quot;&gt;6 fehlend · 1 unvollständig&lt;/span&gt;&lt;/button&gt;&lt;button data-action=&quot;analysis&quot;&gt;&lt;span class=&quot;ct-summary-label&quot;&gt;Ø TEAM-SALDO&lt;/span&gt;&lt;span class=&quot;ct-summary-value&quot; style=&quot;font-size:21px&quot;&gt;−402h 27m&lt;/span&gt;&lt;span class=&quot;ct-summary-detail&quot;&gt;8 negative Salden ↗&lt;/span&gt;&lt;/button&gt;&lt;button data-action=&quot;toplist&quot;&gt;&lt;span class=&quot;ct-summary-label&quot;&gt;TOP-SALDO&lt;/span&gt;&lt;span class=&quot;ct-summary-value&quot; style=&quot;font-size:21px&quot;&gt;30h 49m&lt;/span&gt;&lt;span class=&quot;ct-summary-detail&quot;&gt;Gabriela Tschopp ↗&lt;/span&gt;&lt;/button&gt;&lt;/div&gt;`}
    function peopleRows(){const ps=(state.view===&#x27;overview&#x27;?people.slice(0,4):people).filter(p=&gt;state.team===&#x27;Alle Teams&#x27;||p.role.includes(state.team)).filter(p=&gt;p.name.toLowerCase().includes(state.query.toLowerCase()));return ps.length?ps.map(p=&gt;`&lt;div class=&quot;ct-person-row&quot;&gt;&lt;div class=&quot;ct-person-identity&quot;&gt;&lt;span class=&quot;ct-avatar&quot;&gt;${p.initials}&lt;/span&gt;&lt;div&gt;&lt;button class=&quot;ct-person-link&quot; data-action=&quot;select-person&quot; data-person=&quot;${p.name}&quot;&gt;${p.name}&lt;/button&gt;&lt;div class=&quot;ct-person-sub&quot;&gt;${p.issue===&#x27;Vollständig&#x27;?&#x27;Zeiten vollständig&#x27;:p.issue}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ct-miniweek&quot; aria-label=&quot;Wochentage Montag bis Freitag&quot;&gt;${[...p.pattern].map((v,i)=&gt;`&lt;span class=&quot;ct-miniday ${v===&#x27;r&#x27;?&#x27;gap&#x27;:v===&#x27;f&#x27;?&#x27;future&#x27;:&#x27;&#x27;}&quot;&gt;${[&#x27;M&#x27;,&#x27;D&#x27;,&#x27;M&#x27;,&#x27;D&#x27;,&#x27;F&#x27;][i]}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;ct-balance ${p.balance.startsWith(&#x27;−&#x27;)?&#x27;negative&#x27;:&#x27;&#x27;}&quot;&gt;${p.balance}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;):`&lt;div class=&quot;ct-empty&quot;&gt;Keine Mitarbeitenden gefunden.&lt;/div&gt;`}
    function profile(){const p=person();return `&lt;section class=&quot;ct-section ct-profile&quot;&gt;&lt;div&gt;&lt;div class=&quot;ct-avatar&quot;&gt;${p.initials}&lt;/div&gt;&lt;/div&gt;&lt;div&gt;&lt;div class=&quot;ct-eyebrow&quot;&gt;Ausgewählt&lt;/div&gt;&lt;h2&gt;${p.name}&lt;/h2&gt;&lt;p&gt;${p.role}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;ct-profile-metrics&quot;&gt;&lt;div&gt;&lt;span&gt;Zeitsaldo&lt;/span&gt;&lt;strong&gt;${p.balance}&lt;/strong&gt;&lt;/div&gt;&lt;div&gt;&lt;span&gt;Resturlaub&lt;/span&gt;&lt;strong&gt;12 Tage&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ct-profile-actions&quot;&gt;&lt;button class=&quot;ct-primary&quot; data-action=&quot;vacation&quot;&gt;＋ Urlaub eintragen&lt;/button&gt;&lt;button data-action=&quot;person-detail&quot;&gt;Zeitkonto öffnen ↗&lt;/button&gt;&lt;button data-action=&quot;sickness&quot;&gt;Krankheit / Abwesenheit&lt;/button&gt;&lt;/div&gt;&lt;small class=&quot;ct-muted&quot;&gt;Person ist in allen Aktionen vorausgewählt.&lt;/small&gt;&lt;/section&gt;`}
    function absences(){return `&lt;section class=&quot;ct-section&quot; data-widget=&quot;absences&quot;&gt;&lt;div class=&quot;ct-section-head&quot;&gt;&lt;h2&gt;Abwesenheiten&lt;/h2&gt;&lt;button data-view=&quot;calendar&quot;&gt;Kalender ↗&lt;/button&gt;&lt;/div&gt;&lt;small class=&quot;ct-muted&quot;&gt;Heute und die nächsten 7 Tage&lt;/small&gt;${state.absences.length?state.absences.map(a=&gt;`&lt;div class=&quot;ct-list-item&quot;&gt;&lt;div&gt;&lt;strong&gt;${esc(a.person)}&lt;/strong&gt;&lt;small&gt;${fmt(a.start)} – ${fmt(a.end)} · ${esc(a.type)}&lt;/small&gt;&lt;/div&gt;&lt;button data-action=&quot;edit-absence&quot; data-id=&quot;${a.id}&quot;&gt;Öffnen&lt;/button&gt;&lt;/div&gt;`).join(&#x27;&#x27;):`&lt;div class=&quot;ct-empty&quot; style=&quot;margin-top:12px&quot;&gt;Keine Abwesenheiten geplant.&lt;br&gt;Das gesamte Team ist verfügbar.&lt;/div&gt;`}&lt;/section&gt;`}
    function requestsPreview(){return `&lt;section class=&quot;ct-section&quot; data-widget=&quot;requests&quot;&gt;&lt;div class=&quot;ct-section-head&quot;&gt;&lt;h2&gt;Offene Anträge &lt;span class=&quot;ct-tag gold&quot;&gt;${state.requests}&lt;/span&gt;&lt;/h2&gt;&lt;button data-view=&quot;requests&quot;&gt;Alle ansehen ↗&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;ct-list-item&quot;&gt;&lt;div&gt;&lt;strong&gt;Milka Otten&lt;/strong&gt;&lt;small&gt;Zeitkorrektur · 12.08.2025&lt;/small&gt;&lt;/div&gt;&lt;button data-view=&quot;requests&quot;&gt;Prüfen&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;ct-list-item&quot;&gt;&lt;div&gt;&lt;strong&gt;Milka Otten&lt;/strong&gt;&lt;small&gt;Zeitkorrektur · 13.08.2025&lt;/small&gt;&lt;/div&gt;&lt;button data-view=&quot;requests&quot;&gt;Prüfen&lt;/button&gt;&lt;/div&gt;&lt;/section&gt;`}

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );

      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }

      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }

  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;

    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {

    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),

            );

      .then(({ x, y }) =&gt; {

        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0

      pendingTrigger = null;
      openTooltip(trigger);

    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);

    }

      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)

    }

    }

    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);

      const active = tab === selected;

      const id = tab.getAttribute(&quot;aria-controls&quot;);

      return;

      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);

      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
