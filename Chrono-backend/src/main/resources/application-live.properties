app.production=true
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS}
app.initialize.admin=${APP_INITIALIZE_ADMIN:false}
app.demo-login.enabled=${APP_DEMO_LOGIN_ENABLED:false}
app.demo-login.allow-production=${APP_DEMO_LOGIN_ALLOW_PRODUCTION:false}

jwt.secret=${JWT_SECRET}
nfc.agent.token=${NFC_AGENT_TOKEN}
nfc.agent.allow-localhost-legacy=false
report.ics-feed.token=${REPORT_ICS_FEED_TOKEN}
report.ics-feed.public-without-token=false

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}
llm.warmup.enabled=${LLM_WARMUP_ENABLED:false}

# Production must never mutate the hotel schema implicitly.
spring.jpa.hibernate.ddl-auto=validate
# Existing Chrono web endpoints still resolve lazy, read-only associations while
# building permissions and response DTOs. Keep the pre-PMS request scope until
# those legacy paths have all been moved behind transactional service facades.
spring.jpa.open-in-view=true
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:300}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:20}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:200}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:8192}

spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:40}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:10}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:3000}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:2000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:1700000}
spring.datasource.hikari.leak-detection-threshold=${SPRING_DATASOURCE_HIKARI_LEAK_DETECTION_THRESHOLD:20000}

management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.server.port=8082
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=100ms,250ms,500ms,1s,2s
