app.production=true
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS}
app.initialize.admin=${APP_INITIALIZE_ADMIN:false}
app.demo-login.enabled=${APP_DEMO_LOGIN_ENABLED:false}
app.demo-login.allow-production=${APP_DEMO_LOGIN_ALLOW_PRODUCTION:false}

jwt.secret=${JWT_SECRET}
nfc.agent.token=${NFC_AGENT_TOKEN}
nfc.agent.allow-localhost-legacy=false
report.ics-feed.token=${REPORT_ICS_FEED_TOKEN}
report.ics-feed.public-without-token=false

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}
llm.warmup.enabled=${LLM_WARMUP_ENABLED:false}

# Production must never mutate the hotel schema implicitly.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.forward-headers-strategy=framework
