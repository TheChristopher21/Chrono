spring.profiles.default=local

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=14
spring.flyway.validate-on-migrate=true

app.production=${APP_PRODUCTION:false}
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:https://chrono-logisch.ch,https://www.chrono-logisch.ch}
app.initialize.admin=${APP_INITIALIZE_ADMIN:false}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.demo-login.enabled=${APP_DEMO_LOGIN_ENABLED:false}
app.demo-login.allow-production=${APP_DEMO_LOGIN_ALLOW_PRODUCTION:false}
app.demo-login.session-ttl=${APP_DEMO_LOGIN_SESSION_TTL:PT24H}
app.demo-login.rate-limit.max-requests-per-ip=${APP_DEMO_LOGIN_RATE_LIMIT_MAX_REQUESTS_PER_IP:5}
app.demo-login.rate-limit.global-max-requests=${APP_DEMO_LOGIN_RATE_LIMIT_GLOBAL_MAX_REQUESTS:100}
app.demo-login.rate-limit.window-seconds=${APP_DEMO_LOGIN_RATE_LIMIT_WINDOW_SECONDS:3600}
app.demo-login.cleanup-interval-ms=${APP_DEMO_LOGIN_CLEANUP_INTERVAL_MS:3600000}
app.demo-login.cleanup-initial-delay-ms=${APP_DEMO_LOGIN_CLEANUP_INITIAL_DELAY_MS:300000}
app.balance-rebuild-on-startup=${APP_BALANCE_REBUILD_ON_STARTUP:false}
app.pms.test-account.enabled=${APP_PMS_TEST_ACCOUNT_ENABLED:false}
app.pms.test-account.username=${APP_PMS_TEST_ACCOUNT_USERNAME:Christopher}
app.pms.test-account.password=${APP_PMS_TEST_ACCOUNT_PASSWORD:}
app.pms.demo-data.enabled=${APP_PMS_DEMO_DATA_ENABLED:false}
app.pms.public-rate-limit.max-requests=${APP_PMS_PUBLIC_RATE_LIMIT_MAX_REQUESTS:30}
app.pms.public-rate-limit.window-seconds=${APP_PMS_PUBLIC_RATE_LIMIT_WINDOW_SECONDS:60}
app.pms.outbox.enabled=${APP_PMS_OUTBOX_ENABLED:false}
app.pms.outbox.interval-ms=${APP_PMS_OUTBOX_INTERVAL_MS:10000}
app.pms.outbox.initial-delay-ms=${APP_PMS_OUTBOX_INITIAL_DELAY_MS:15000}
app.pms.outbox.max-attempts=${APP_PMS_OUTBOX_MAX_ATTEMPTS:8}
app.pms.outbox.initial-backoff=${APP_PMS_OUTBOX_INITIAL_BACKOFF:PT30S}
app.pms.outbox.lock-timeout=${APP_PMS_OUTBOX_LOCK_TIMEOUT:PT10M}
app.pms.monitoring.pending-warning-age=${APP_PMS_MONITORING_PENDING_WARNING_AGE:PT15M}
app.pms.alerts.enabled=${APP_PMS_ALERTS_ENABLED:false}
app.pms.alerts.interval-ms=${APP_PMS_ALERTS_INTERVAL_MS:300000}
app.pms.alerts.initial-delay-ms=${APP_PMS_ALERTS_INITIAL_DELAY_MS:60000}
app.pms.webhooks.allowed-clock-skew=${APP_PMS_WEBHOOK_ALLOWED_CLOCK_SKEW:PT5M}
app.pms.provider-gateway.enabled=${APP_PMS_PROVIDER_GATEWAY_ENABLED:false}
app.pms.provider-gateway.endpoint=${APP_PMS_PROVIDER_GATEWAY_ENDPOINT:}
app.pms.provider-gateway.secret=${APP_PMS_PROVIDER_GATEWAY_SECRET:}
app.pms.provider-gateway.timeout=${APP_PMS_PROVIDER_GATEWAY_TIMEOUT:PT10S}
app.pms.payments.simulated.enabled=${APP_PMS_PAYMENTS_SIMULATED_ENABLED:false}
app.pms.payments.stripe.enabled=${APP_PMS_PAYMENTS_STRIPE_ENABLED:false}
app.backup.enabled=${APP_BACKUP_ENABLED:false}
app.backup.monitoring.enabled=${APP_BACKUP_MONITORING_ENABLED:${APP_BACKUP_ENABLED:false}}
app.backup.directory=${BACKUP_DIR:/var/backup}
app.backup.max-age=${APP_BACKUP_MAX_AGE:PT26H}
app.backup.minimum-bytes=${APP_BACKUP_MINIMUM_BYTES:1024}
app.backup.retention=${APP_BACKUP_RETENTION:PT720H}
app.backup.cron=${APP_BACKUP_CRON:0 45 23 * * *}
app.backup.mysqldump-bin=${MYSQLDUMP_BIN:/usr/bin/mysqldump}
app.backup.mysql-bin=${MYSQL_BIN:/usr/bin/mysql}
app.backup.restore-test.enabled=${APP_BACKUP_RESTORE_TEST_ENABLED:false}
app.backup.restore-test.host=${APP_BACKUP_RESTORE_TEST_HOST:localhost}
app.backup.restore-test.port=${APP_BACKUP_RESTORE_TEST_PORT:3306}
app.backup.restore-test.user=${APP_BACKUP_RESTORE_TEST_USER:root}
app.backup.restore-test.password=${APP_BACKUP_RESTORE_TEST_PASSWORD:}
app.backup.restore-test.max-age=${APP_BACKUP_RESTORE_TEST_MAX_AGE:PT168H}
app.backup.restore-test.cron=${APP_BACKUP_RESTORE_TEST_CRON:0 30 2 * * SUN}

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
nfc.agent.token=${NFC_AGENT_TOKEN}
nfc.agent.allow-localhost-legacy=${NFC_AGENT_ALLOW_LOCALHOST_LEGACY:false}
report.ics-feed.token=${REPORT_ICS_FEED_TOKEN:}
report.ics-feed.public-without-token=${REPORT_ICS_FEED_PUBLIC_WITHOUT_TOKEN:false}

spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jackson.time-zone=Europe/Zurich

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:INFO}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

spring.security.user.name=${SPRING_SECURITY_USER_NAME:}
spring.security.user.password=${SPRING_SECURITY_USER_PASSWORD:}

# Stripe is optional. Leave unset unless payments are enabled.
stripe.secret-key=${STRIPE_SECRET_KEY:}

# Allow larger multipart uploads (e.g., company logo files)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Local LLM endpoint
llm.base-url=${LLM_BASE_URL:http://localhost:5000}
chat.rate-limit.max-requests=${CHAT_RATE_LIMIT_MAX_REQUESTS:20}
chat.rate-limit.window-seconds=${CHAT_RATE_LIMIT_WINDOW_SECONDS:300}

# Banking integrations
banking.integrations.payments.enabled=${BANKING_PAYMENTS_ENABLED:false}
banking.integrations.payments.mode=${BANKING_PAYMENTS_MODE:SIMULATED}
banking.integrations.payments.endpoint=${BANKING_PAYMENTS_ENDPOINT:}
banking.integrations.payments.api-key=${BANKING_PAYMENTS_API_KEY:}
banking.integrations.payments.content-type=${BANKING_PAYMENTS_CONTENT_TYPE:application/xml}
banking.integrations.payments.export-directory=${BANKING_PAYMENTS_EXPORT_DIRECTORY:}
banking.integrations.payments.export-channel=${BANKING_PAYMENTS_EXPORT_CHANNEL:EBICS}
banking.integrations.payments.export-metadata=${BANKING_PAYMENTS_EXPORT_METADATA:true}
banking.integrations.signatures.enabled=${BANKING_SIGNATURES_ENABLED:false}
banking.integrations.signatures.base-url=${BANKING_SIGNATURES_BASE_URL:}
banking.integrations.signatures.api-key=${BANKING_SIGNATURES_API_KEY:}
banking.integrations.signatures.poll-interval=${BANKING_SIGNATURES_POLL_INTERVAL:PT5M}
banking.integrations.messages.enabled=${BANKING_MESSAGES_ENABLED:false}
banking.integrations.messages.endpoint=${BANKING_MESSAGES_ENDPOINT:}
banking.integrations.messages.api-key=${BANKING_MESSAGES_API_KEY:}

# Monitoring endpoints
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true

# Comma-separated IPs that should not be counted by Chrono Analytics.
app.analytics.excluded-ips=${APP_ANALYTICS_EXCLUDED_IPS:146.185.87.126}

# Fail fast only when legacy Supply Chain rows without company_id should block startup explicitly.
app.supply-chain.fail-on-missing-company-assignment=${APP_SUPPLY_CHAIN_FAIL_ON_MISSING_COMPANY_ASSIGNMENT:false}
